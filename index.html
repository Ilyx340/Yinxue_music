<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, view-fit=cover, user-scalable=no">
    <link rel="icon" type="image/x-icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f3b5.svg">
    <title>YinXue Music · By 英雪</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        *::-webkit-scrollbar {
            display: none;
        }

        /* 动态模糊背景 + 流动光晕 (丝滑动画) */
        .dynamic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(60px) saturate(1.6);
            transform: scale(1.05);
            transition: background-image 0.6 cubic-bezier(0.2, 0.9, 0.4, 1.2);
        }
        .flowing-aura {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 30% 40%, rgba(255,180,100,0.25), rgba(120,80,200,0.15), transparent 70%);
            opacity: 0.6;
            pointer-events: none;
            animation: flowAura 12 infinite alternate ease-in-out;
        }
        @keyframes flowAura {
            0% { background: radial-gradient(circle at 20% 30%, rgba(255,200,120,0.3), rgba(100,90,210,0.15), transparent 75%); transform: scale(1); }
            50% { background: radial-gradient(circle at 70% 60%, rgba(200,130,200,0.3), rgba(80,160,200,0.2), transparent 70%); transform: scale(1.02); }
            100% { background: radial-gradient(circle at 40% 80%, rgba(255,180,90,0.3), rgba(70,100,220,0.2), transparent 75%); transform: scale(1); }
        }
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: -1;
            backdrop-filter: brightness(0.85);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
            background: #0a0c12;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .player-app {
            width: 100%;
            height: 100vh;
            position: relative;
            z-index: 2;
        }

        /* 全屏切换动画遮罩 */
        .fullscreen-transition-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4 ease;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .fullscreen-transition-mask.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .transition-text {
            color: #fff;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0,122,255,0.5);
            opacity: 0;
            transform: translateY(40px);
        }
        .transition-text.animate {
            animation: textFlyInFadeOut 2 cubic-bezier(0.2, 0.9, 0.4, 1.2) forwards;
        }
        @keyframes textFlyInFadeOut {
            0% { opacity: 0; transform: translateY(40px); }
            20% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        /* 伪全屏样式（桌面布局全屏模式） */
        .player-app.web-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            background: transparent;
        }
        .player-app.web-fullscreen .dynamic-bg,
        .player-app.web-fullscreen .bg-overlay,
        .player-app.web-fullscreen .flowing-aura {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -2;
        }
        .player-app.web-fullscreen .mobile-layout {
            display: none;
        }
        .player-app.web-fullscreen .desktop-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* ========= 桌面端布局 ========= */
        .desktop-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .fullscreen-glass {
            width: 85%;
            max-width: 1400px;
            background: rgba(12, 14, 20, 0.4);
            backdrop-filter: blur(32px);
            border-radius: 56px;
            border: 1px solid rgba(236, 217, 180, 0.25);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.4);
            display: flex;
            overflow: hidden;
        }
        .fs-left {
            flex: 1;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            background: transparent;
        }
        .fs-right {
            flex: 3;
            padding: 2rem 2rem 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(236, 217, 180, 0.25);
            background: transparent;
            overflow: hidden;
            height: 100%;
        }
        .fs-lyrics-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 6px;
            max-height: calc(85vh - 80px);
        }
        .fs-lyrics-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: stretch;
            padding-bottom: 2rem;
        }
        .fs-cover-img {
            width: 180px;
            height: 180px;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 18px 32px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: transform 0.3 cubic-bezier(0.2, 0.9, 0.4, 1.2);
        }
        .fs-cover-img:hover {
            transform: scale(1.02);
        }
        .fs-cover-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .fs-song-meta {
            cursor: pointer;
            text-align: center;
            width: 100%;
        }
        .fs-song-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #F1E6D4, #DDCEB0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.25rem;
        }
        .fs-song-artist {
            font-size: 1rem;
            color: #d4cbbe;
        }
        .fs-controls {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
        }
        .fs-progress-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: #f0e3d0;
        }
        .fs-progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 245, 220, 0.3);
            border-radius: 20px;
            cursor: pointer;
        }
        .fs-progress-fill {
            width: 0%;
            height: 100%;
            background: #ecd9b4;
            border-radius: 20px;
        }
        .fs-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .fs-btn {
            background: rgba(255, 245, 225, 0.12);
            border: 1px solid rgba(255, 245, 225, 0.25);
            width: 52px;
            height: 52px;
            border-radius: 40px;
            font-size: 1.4rem;
            cursor: pointer;
            color: #f5e6d4;
            transition: all 0.2 ease;
        }
        .fs-btn.play-pause {
            background: #ecd9b4;
            border: none;
            color: #1e1b16;
            width: 64px;
            height: 64px;
            font-size: 1.8rem;
        }
        .fs-btn.repeat-active {
            background: rgba(236, 217, 180, 0.7);
            border-color: #ecd9b4;
            color: #fff;
        }

        /* 桌面歌词条目 - 丝滑动画 + 亮条 */
        .fs-lyric-item {
            width: 100%;
            transition: all 0.45 cubic-bezier(0.2, 0.85, 0.4, 1);
            cursor: pointer;
            opacity: 0.55;
            padding: 6px 0px 6px 0px;
        }
        .fs-lyric-item.left { text-align: left; }
        .fs-lyric-item.right { text-align: right; }
        .fs-lyric-item.center { text-align: center; }
        
        .fs-lyric-text-wrapper {
            display: inline-block;
            position: relative;
        }
        .fs-lyric-text {
            font-size: 1.4rem;
            color: #f0e2cf;
            display: inline-block;
            padding: 0 6px;
            transition: all 0.45 cubic-bezier(0.2, 0.85, 0.4, 1);
        }
        .fs-singer-name {
            font-size: 0.7rem;
            color: #f0e2cf;
            opacity: 0.8;
            margin: 0 4px;
            display: inline-block;
            transition: all 0.45 cubic-bezier(0.2, 0.85, 0.4, 1);
        }
        /* 右对齐时歌手标签放在歌词前面 */
        .fs-lyric-item.right .fs-singer-name {
            order: -1;
            margin-right: 8px;
            margin-left: 0;
        }
        .fs-lyric-item.left .fs-singer-name {
            margin-left: 8px;
            margin-right: 0;
        }
        .fs-lyric-item.center .fs-singer-name {
            display: none;
        }
        
        /* 亮条 */
        .fs-lyric-item.left .fs-lyric-text-wrapper {
            border-left: 2px solid transparent;
            padding-left: 12px;
            transition: border-color 0.45 cubic-bezier(0.2, 0.85, 0.4, 1);
        }
        .fs-lyric-item.right .fs-lyric-text-wrapper {
            border-right: 2px solid transparent;
            padding-right: 12px;
            transition: border-color 0.45 cubic-bezier(0.2, 0.85, 0.4, 1);
        }
        .fs-lyric-item.center .fs-lyric-text-wrapper {
            border-left: 2px solid transparent;
            border-right: 2px solid transparent;
            padding: 0 12px;
            transition: border-color 0.45 cubic-bezier(0.2, 0.85, 0.4, 1);
        }
        .fs-lyric-item.active .fs-lyric-text-wrapper {
            border-left-color: #ecd9b4;
            border-right-color: #ecd9b4;
        }
        .fs-lyric-item.active {
            opacity: 1;
        }
        .fs-lyric-item.active .fs-lyric-text {
            color: #FFF6E5;
            font-size: 1.8rem;
            font-weight: 600;
            text-shadow: 0 0 4px rgba(236,217,180,0.3);
        }
        .fs-lyric-item.sung .fs-lyric-text {
            opacity: 0.2;
            font-size: 1.2rem;
        }
        .fs-interlude-dots {
            display: flex;
            gap: 10px;
            padding: 10px 0 10px 16px;
        }
        .fs-dot {
            width: 5px;
            height: 5px;
            background: #ecd9b4;
            border-radius: 50%;
            animation: breathe 2.2 infinite ease-in-out;
        }
        @keyframes breathe {
            0% { opacity: 0.3; transform: scale(0.7); }
            50% { opacity: 1; transform: scale(1.2); background-color: #ecd9b4; }
            100% { opacity: 0.3; transform: scale(0.7); }
        }
        .fs-interlude-dots.hidden { display: none; }

        /* ========= 移动端布局 ========= */
        .mobile-layout {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: rgba(12, 14, 20, 0.4);
            backdrop-filter: blur(28px);
        }
        .mobile-lyrics-header {
            padding: 1.2rem 1.2rem 0.5rem 1.2rem;
            flex-shrink: 0;
        }
        .mobile-lyrics-header .lyrics-header {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #cfc2a8;
            letter-spacing: 1px;
        }
        .mobile-layout .lyrics-container {
            flex: 1;
            overflow-y: auto;
            padding: 0 1.2rem 0.5rem 1.2rem;
        }
        .mobile-layout .lyrics-list {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            align-items: stretch;
            padding-bottom: 2rem;
        }
        .lyric-item {
            width: 100%;
            transition: all 0.35 cubic-bezier(0.2, 0.85, 0.4, 1);
            line-height: 1.45;
            cursor: pointer;
            opacity: 0.55;
            padding: 4px 0px 4px 0px;
        }
        .lyric-item.left { text-align: left; }
        .lyric-item.right { text-align: right; }
        .lyric-item.center { text-align: center; }
        
        .lyric-text-wrapper {
            display: inline-block;
            position: relative;
        }
        .lyric-text {
            font-size: 1.1rem;
            color: #e8dccc;
            display: inline-block;
            padding: 0 6px;
            transition: all 0.35 cubic-bezier(0.2, 0.85, 0.4, 1);
        }
        .singer-name {
            font-size: 0.6rem;
            color: #e8dccc;
            opacity: 0.8;
            display: inline-block;
            letter-spacing: 0.5px;
            transition: all 0.35 cubic-bezier(0.2, 0.85, 0.4, 1);
        }
        .lyric-item.right .singer-name {
            order: -1;
            margin-right: 6px;
            margin-left: 0;
        }
        .lyric-item.left .singer-name {
            margin-left: 6px;
            margin-right: 0;
        }
        .lyric-item.center .singer-name {
            display: none;
        }
        
        .lyric-item.left .lyric-text-wrapper {
            border-left: 2px solid transparent;
            padding-left: 8px;
            transition: border-color 0.35 cubic-bezier(0.2, 0.85, 0.4, 1);
        }
        .lyric-item.right .lyric-text-wrapper {
            border-right: 2px solid transparent;
            padding-right: 8px;
            transition: border-color 0.35 cubic-bezier(0.2, 0.85, 0.4, 1);
        }
        .lyric-item.center .lyric-text-wrapper {
            border-left: 2px solid transparent;
            border-right: 2px solid transparent;
            padding: 0 8px;
            transition: border-color 0.35 cubic-bezier(0.2, 0.85, 0.4, 1);
        }
        .lyric-item.active .lyric-text-wrapper {
            border-left-color: #ecd9b4;
            border-right-color: #ecd9b4;
        }
        .lyric-item.active {
            opacity: 1;
        }
        .lyric-item.active .lyric-text {
            color: #FFF6E5;
            font-size: 1.28rem;
            font-weight: 600;
            text-shadow: 0 0 4px rgba(236,217,180,0.3);
        }
        .lyric-item.sung .lyric-text {
            opacity: 0.2;
            font-size: 0.95rem;
        }
        .lyric-item.upcoming .lyric-text {
            opacity: 0.55;
            font-size: 1.05rem;
        }
        .interlude-dots {
            display: flex;
            gap: 10px;
            padding: 8px 0 8px 12px;
        }
        .dot {
            width: 5px;
            height: 5px;
            background: #ecd9b4;
            border-radius: 50%;
            animation: breathe 2.2 infinite ease-in-out;
        }
        .interlude-dots.hidden { display: none; }

        /* 移动端底部控制器 */
        .mobile-layout .control-bar {
            background: rgba(8, 10, 16, 0.45);
            backdrop-filter: blur(28px);
            border-top: 1px solid rgba(236, 217, 180, 0.15);
            border-radius: 24px 24px 0 0;
            padding: 1rem 1.2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            flex-shrink: 0;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        .song-info {
            flex: 1;
            cursor: pointer;
            touch-action: pan-y;
        }
        .song-title-bottom {
            font-size: 1.2rem;
            font-weight: 650;
            background: linear-gradient(135deg, #F1E6D4, #DDCEB0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .song-artist-bottom {
            font-size: 0.75rem;
            color: #cfc3ae;
        }
        .cover-thumb {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
        }
        .cover-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .progress-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.7rem;
            color: #e2d4c0;
        }
        .progress-bar-bg {
            flex: 1;
            height: 3px;
            background: rgba(255, 245, 220, 0.3);
            border-radius: 20px;
            cursor: pointer;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #ecd9b4;
            border-radius: 20px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 0.2rem;
        }
        .ctrl-btn {
            background: rgba(255, 245, 225, 0.12);
            border: 1px solid rgba(255, 245, 225, 0.25);
            width: 44px;
            height: 44px;
            border-radius: 30px;
            font-size: 1.2rem;
            cursor: pointer;
            color: #f5e6d4;
            transition: all 0.2 ease;
        }
        .ctrl-btn.play-pause {
            background: #ecd9b4;
            border: none;
            color: #1e1b16;
            width: 54px;
            height: 54px;
            font-size: 1.5rem;
        }
        .ctrl-btn.repeat-active {
            background: rgba(236, 217, 180, 0.6);
            border-color: #ecd9b4;
            color: #fff;
        }

        @media (max-width: 900px) {
            .fullscreen-glass { width: 95%; }
            .fs-cover-img { width: 140px; height: 140px; }
            .fs-song-title { font-size: 1.5rem; }
            .fs-btn { width: 44px; height: 44px; font-size: 1.2rem; }
            .fs-btn.play-pause { width: 54px; height: 54px; font-size: 1.5rem; }
            .fs-lyric-text { font-size: 1.2rem; }
            .fs-lyric-item.active .fs-lyric-text { font-size: 1.5rem; }
        }

        /* 响应式：默认桌面显示，移动端显示移动布局 */
        @media (max-width: 900px) {
            .desktop-layout { display: none !important; }
            .mobile-layout { display: flex !important; }
            .player-app.web-fullscreen .mobile-layout { display: none !important; }
            .player-app.web-fullscreen .desktop-layout { display: flex !important; }
        }
        @media (min-width: 901px) {
            .mobile-layout { display: none !important; }
            .desktop-layout { display: flex !important; }
        }

        /* 播放列表管理器 - 双按钮布局 */
        .playlist-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(24px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1100;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3 ease, visibility 0 linear 0.3;
        }
        .playlist-modal.show {
            visibility: visible;
            opacity: 1;
            transition: opacity 0.3 ease;
        }
        .playlist-modal-content {
            background: rgba(30, 32, 44, 0.75);
            backdrop-filter: blur(40px);
            border-radius: 48px;
            width: 90%;
            max-width: 650px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4);
            color: #f0e2cf;
        }
        .playlist-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 1.3rem;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 0.8rem;
        }
        .playlist-modal-header h3 { color: #ecd9b4; }
        .close-playlist-modal {
            background: transparent !important;
            border: none !important;
            font-size: 1.8rem;
            cursor: pointer;
            color: #cfc3ae !important;
            transition: 0.2;
            padding: 0;
            line-height: 1;
        }
        .close-playlist-modal:hover { color: #ecd9b4 !important; }
        .playlist-song-list { max-height: 400px; overflow-y: auto; margin-bottom: 1rem; }
        .playlist-song-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 60px;
            padding: 10px 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.25 ease;
        }
        .playlist-song-item:hover { background: rgba(236, 217, 180, 0.25); }
        .playlist-song-cover { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; }
        .playlist-song-info { flex: 1; }
        .playlist-song-name { font-weight: 600; font-size: 0.95rem; }
        .playlist-song-artist { font-size: 0.7rem; opacity: 0.7; }
        .playlist-delete-btn {
            background: transparent !important;
            border: none !important;
            color: #cfc3ae !important;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .playlist-delete-btn:hover { color: #ffaa88 !important; }
        .playlist-add-section {
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 1rem;
            margin-top: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .playlist-add-title {
            font-size: 0.9rem;
            margin-bottom: 0.2rem;
            color: #ecd9b4;
        }
        .file-input-group { margin: 10px 0; }
        .file-label { display: block; font-size: 0.75rem; opacity: 0.8; margin-bottom: 4px; }
        .playlist-modal input[type="file"] {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(236, 217, 180, 0.4);
            border-radius: 40px;
            padding: 8px 12px;
            width: 100%;
            color: white;
        }
        .add-song-submit {
            background: #ecd9b4 !important;
            border: none !important;
            border-radius: 40px !important;
            padding: 10px 20px !important;
            color: #1e1b16 !important;

<div id="playlistManagerModal" class="playlist-modal"><div class="playlist-modal-content"><div class="playlist-modal-header"><h3>播放列表管理器</h3><button class="close-playlist-modal" id="closePlaylistModalBtn">&times;</button></div><div class="playlist-song-list" id="playlistModalList"></div><div class="playlist-add-section"><div class="playlist-add-title">✚ 添加新歌曲</div><div class="file-input-group"><label class="file-label">♫ 音频文件</label><input type="file" id="modalAudioFile" accept="audio/mpeg,audio/mp3"></div><div class="file-input-group"><label class="file-label">☵ 歌词文件 (支持 [left]/[right]/[all] 标签)</label><input type="file" id="modalLyricsFile" accept="text/plain"></div><div class="file-input-group"><label class="file-label">₪ 专辑封面</label><input type="file" id="modalCoverFile" accept="image/jpeg,image/png,image/webp"></div><button class="add-song-submit" id="modalAddSongBtn">添加到播放列表</button><div class="demo-song-btn" id="demoSongBtn">🎵 添加官方歌曲《男模》</div><div class="marry-song-btn" id="marrySongBtn">💒 一键添加《今天你要嫁给我》</div></div></div></div>

<script>
    // 通用歌词解析：支持 [left]歌手名： / [right]歌手名： / [all] 或 [center]
    function parseLyricsFull(content) {
        if (content.charCodeAt(0) === 0xFEFF) content = content.slice(1);
        const lines = content.split(/\r?\n/).filter(l => l.trim());
        let songName = "未知歌曲", artistAlbum = "未知艺术家";
        if (lines.length >= 1) songName = lines[0].trim();
        if (lines.length >= 2) artistAlbum = lines[1].trim();
        const timeline = [];
        let currentAlign = "left";
        let currentSinger = "";
        
        for (let line of lines) {
            let dirMatch = line.match(/^\[(left|right|all|center)\]\s*(.*?)[：:]\s*$/);
            if (dirMatch) {
                const dir = dirMatch[1];
                let singerRaw = dirMatch[2].trim();
                if (dir === "left") { currentAlign = "left"; currentSinger = singerRaw || ""; }
                else if (dir === "right") { currentAlign = "right"; currentSinger = singerRaw || ""; }
                else if (dir === "all" || dir === "center") { currentAlign = "center"; currentSinger = ""; }
                continue;
            }
            let otherMatch = line.match(/^\[other\]\s*(.*?)[：:]\s*$/);
            if (otherMatch) {
                currentAlign = "left";
                currentSinger = otherMatch[1].trim() || "";
                continue;
            }
            const regex = /(?:\[)?(\d{1,2}):(\d{1,2})\.(\d{1,6})(?:\])?\s*(.+)/;
            const m = line.match(regex);
            if (m) {
                const minutes = parseInt(m[1], 10);
                const seconds = parseInt(m[2], 10);
                let msStr = m[3];
                let millis = parseInt(msStr, 10);
                if (isNaN(millis)) millis = 0;
                else if (msStr.length === 1) millis *= 100;
                else if (msStr.length === 2) millis *= 10;
                let text = m[4].trim();
                if (text) {
                    const timeSec = minutes * 60 + seconds + millis / 1000;
                    timeline.push({
                        time: parseFloat(timeSec.toFixed(3)),
                        text: text,
                        align: currentAlign,
                        singer: currentSinger
                    });
                }
            }
        }
        timeline.sort((a, b) => a.time - b.time);
        return { songName, artistAlbum, timeline };
    }

    // 播放器核心逻辑
    let playlist = [], currentSongId = null, audio = new Audio(), isPlaying = false, animFrame = null, isRepeat = false;
    // DOM 元素
    const fsCoverImg = document.getElementById('fullscreenCoverImg'), fsSongTitle = document.getElementById('fullscreenSongTitle'), fsArtist = document.getElementById('fullscreenArtist');
    const fsPlayPause = document.getElementById('fullscreenPlayPause'), fsPrevBtn = document.getElementById('fullscreenPrevBtn'), fsNextBtn = document.getElementById('fullscreenNextBtn');
    const fsProgressFill = document.getElementById('fullscreenProgressFill'), fsProgressBg = document.getElementById('fullscreenProgressBg'), fsCurrentTime = document.getElementById('fullscreenCurrentTime'), fsDuration = document.getElementById('fullscreenDuration');
    const fsRepeatBtn = document.getElementById('fullscreenRepeatBtn'), fsMenuBtn = document.getElementById('fullscreenMenuBtn'), fsLyricsList = document.getElementById('fullscreenLyricsList'), fsLyricsScroll = document.getElementById('fullscreenLyricsScroll');
    const mobileCoverImg = document.getElementById('mobileCoverImg'), mobileSongTitle = document.getElementById('mobileSongTitle'), mobileArtist = document.getElementById('mobileArtist');
    const mobilePlayPause = document.getElementById('mobilePlayPause'), mobilePrevBtn = document.getElementById('mobilePrevBtn'), mobileNextBtn = document.getElementById('mobileNextBtn');
    const mobileProgressFill = document.getElementById('mobileProgressFill'), mobileProgressBg = document.getElementById('mobileProgressBg'), mobileCurrentTime = document.getElementById('mobileCurrentTime'), mobileDuration = document.getElementById('mobileDuration');
    const mobileRepeatBtn = document.getElementById('mobileRepeatBtn'), mobileMenuBtn = document.getElementById('mobileMenuBtn'), mobileLyricsList = document.getElementById('mobileLyricsList'), mobileLyricsContainer = document.getElementById('mobileLyricsContainer');
    const dynamicBg = document.getElementById('dynamicBg'), bgOverlay = document.getElementById('bgOverlay'), appContainer = document.getElementById('playerApp');
    const playlistModal = document.getElementById('playlistManagerModal'), closePlaylistModalBtn = document.getElementById('closePlaylistModalBtn');
    const modalAudioFile = document.getElementById('modalAudioFile'), modalLyricsFile = document.getElementById('modalLyricsFile'), modalCoverFile = document.getElementById('modalCoverFile');
    const modalAddSongBtn = document.getElementById('modalAddSongBtn'), playlistModalList = document.getElementById('playlistModalList');
    const demoSongBtn = document.getElementById('demoSongBtn');
    const marrySongBtn = document.getElementById('marrySongBtn');
    const transitionMask = document.getElementById('transitionMask'), transitionText = document.getElementById('transitionText');

    function formatTime(sec) { if (isNaN(sec)) return "0:00"; const m = Math.floor(sec / 60),  = Math.floor(sec % 60); return `${m}:${ < 10 ? '0' +  : }`; }
    function updateBackgroundFromCover(src) {
        if (!src) return;
        dynamicBg.style.backgroundImage = `url('${src}')`;
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 50; canvas.height = 50;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, 50, 50);
            const data = ctx.getImageData(0, 0, 50, 50).data;
            let r = 0, g = 0, b = 0, count = 0;
            for (let i = 0; i < data.length; i += 4) { r += data[i]; g += data[i+1]; b += data[i+2]; count++; }
            r = Math.floor(r / count); g = Math.floor(g / count); b = Math.floor(b / count);
            bgOverlay.style.background = `linear-gradient(135deg, rgba(0,0,0,0.7), rgba(${r},${g},${b},0.68))`;
            const aura = document.getElementById('flowingAura');
            aura.style.background = `radial-gradient(circle at 40% 50%, rgba(${r},${g+40},${b+30},0.25), rgba(${r-20},${g-10},${b+50},0.15), transparent 80%)`;
        };
        img.src = src;
    }

    let currentLyricsTimeline = [], fsDomItems = [], mobileDomItems = [], lastFsIdx = -1, lastMobileIdx = -1;
    function renderBothPanels() {
        fsLyricsList.innerHTML = ''; mobileLyricsList.innerHTML = ''; fsDomItems = []; mobileDomItems = [];
        currentLyricsTimeline.forEach(item => {
            // 桌面
            const fsDiv = document.createElement('div');
            fsDiv.className = `fs-lyric-item ${item.align}`;
            fsDiv.setAttribute('data-time', item.time);
            fsDiv.onclick = () => { if (audio && !isNaN(item.time)) audio.currentTime = item.time; };
            let singerHtml = '';
            if (item.singer && item.align !== 'center') {
                singerHtml = `<span class="fs-singer-name">${escapeHtml(item.singer)}</span>`;
            }
            if (item.align === 'right') {
                fsDiv.innerHTML = `${singerHtml}<span class="fs-lyric-text-wrapper"><span class="fs-lyric-text">${escapeHtml(item.text)}</span></span>`;
            } else {
                fsDiv.innerHTML = `<span class="fs-lyric-text-wrapper"><span class="fs-lyric-text">${escapeHtml(item.text)}</span></span>${singerHtml}`;
            }
            fsLyricsList.appendChild(fsDiv);
            fsDomItems.push({ el: fsDiv, time: item.time });
            // 移动
            const mobDiv = document.createElement('div');
            mobDiv.className = `lyric-item upcoming ${item.align}`;
            mobDiv.setAttribute('data-time', item.time);
            mobDiv.onclick = () => { if (audio && !isNaN(item.time)) audio.currentTime = item.time; };
            let mobSingerHtml = '';
            if (item.singer && item.align !== 'center') {
                mobSingerHtml = `<span class="singer-name">${escapeHtml(item.singer)}</span>`;
            }
            if (item.align === 'right') {
                mobDiv.innerHTML = `${mobSingerHtml}<span class="lyric-text-wrapper"><span class="lyric-text">${escapeHtml(item.text)}</span></span>`;
            } else {
                mobDiv.innerHTML = `<span class="lyric-text-wrapper"><span class="lyric-text">${escapeHtml(item.text)}</span></span>${mobSingerHtml}`;
            }
            mobileLyricsList.appendChild(mobDiv);
            mobileDomItems.push({ el: mobDiv, time: item.time });
        });
    }

    function updateUIByPlaybackTime(currentSec) {
        let activeIdx = -1;
        for (let i = 0; i < fsDomItems.length; i++) if (fsDomItems[i].time <= currentSec) activeIdx = i;
        for (let i = 0; i < fsDomItems.length; i++) {
            const el = fsDomItems[i].el;
            if (fsDomItems[i].time <= currentSec) {
                if (i === activeIdx) { el.classList.add('active'); el.classList.remove('sung'); }
                else { el.classList.add('sung'); el.classList.remove('active'); }
            } else { el.classList.remove('active', 'sung'); }
        }
        if (activeIdx !== -1 && activeIdx !== lastFsIdx) {
            const actEl = fsDomItems[activeIdx]?.el;
            if (actEl) actEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
            lastFsIdx = activeIdx;
        }
        let mobileActive = -1;
        for (let i = 0; i < mobileDomItems.length; i++) if (mobileDomItems[i].time <= currentSec) mobileActive = i;
        for (let i = 0; i < mobileDomItems.length; i++) {
            const el = mobileDomItems[i].el;
            if (mobileDomItems[i].time <= currentSec) {
                if (i === mobileActive) { el.classList.add('active'); el.classList.remove('sung', 'upcoming'); }
                else { el.classList.add('sung'); el.classList.remove('active', 'upcoming'); }
            } else { el.classList.add('upcoming'); el.classList.remove('active', 'sung'); }
        }
        if (mobileActive !== -1 && mobileActive !== lastMobileIdx) {
            const actEl = mobileDomItems[mobileActive]?.el;
            if (actEl) {
                requestAnimationFrame(() => {
                    const cr = mobileLyricsContainer.getBoundingClientRect();
                    const er = actEl.getBoundingClientRect();
                    const offset = er.top - (cr.top + cr.height / 2 - 80);
                    mobileLyricsContainer.scrollBy({ top: offset, behavior: 'smooth' });
                });
            }
            lastMobileIdx = mobileActive;
        }
    }

    function updateProgressAndTime() {
        if (!audio.duration) return;
        const p = audio.currentTime / audio.duration * 100;
        fsProgressFill.style.width = p + '%';
        mobileProgressFill.style.width = p + '%';
        fsCurrentTime.textContent = formatTime(audio.currentTime);
        mobileCurrentTime.textContent = formatTime(audio.currentTime);
        fsDuration.textContent = formatTime(audio.duration);
        mobileDuration.textContent = formatTime(audio.duration);
        updateUIByPlaybackTime(audio.currentTime);
    }

    function startAnimation() {
        if (animFrame) cancelAnimationFrame(animFrame);
        (function tick() {
            if (audio && !audio.paused && audio.src) updateProgressAndTime();
            animFrame = requestAnimationFrame(tick);
        })();
    }

    function togglePlayPause() {
        if (isPlaying) {
            audio.pause();
            isPlaying = false;
            fsPlayPause.innerHTML = '▶';
            mobilePlayPause.innerHTML = '▶';
            if (animFrame) cancelAnimationFrame(animFrame);
            animFrame = null;
        } else {
            if (!audio.src && playlist.length === 0) { showPlaylistModal(); return; }
            if (!audio.src && playlist.length > 0) { playSongById(playlist[playlist.length - 1].id); return; }
            audio.play().then(() => {
                isPlaying = true;
                fsPlayPause.innerHTML = '■';
                mobilePlayPause.innerHTML = '■';
                startAnimation();
            }).catch(() => {});
        }
    }
    function prevSong() { if (!playlist.length) return; let idx = playlist.findIndex( => .id === currentSongId); if (idx === -1) idx = 0; let newIdx = (idx - 1 + playlist.length) % playlist.length; playSongById(playlist[newIdx].id); }
    function nextSong() { if (!playlist.length) return; let idx = playlist.findIndex( => .id === currentSongId); if (idx === -1) idx = 0; let newIdx = (idx + 1) % playlist.length; playSongById(playlist[newIdx].id); }
    function toggleRepeat() { isRepeat = !isRepeat; fsRepeatBtn.classList.toggle('repeat-active', isRepeat); mobileRepeatBtn.classList.toggle('repeat-active', isRepeat); }
    function playSongById(id) {
        const song = playlist.find( => .id === id);
        if (!song) return;
        if (audio.src) 网站.revokeObjectURL(audio.src);
        audio.src = song.audioUrl;
        currentSongId = song.id;
        fsSongTitle.textContent = song.name;
        fsArtist.textContent = song.artist;
        mobileSongTitle.textContent = song.name;
        mobileArtist.textContent = song.artist;
        fsCoverImg.src = song.coverUrl;
        mobileCoverImg.src = song.coverUrl;
        updateBackgroundFromCover(song.coverUrl);
        currentLyricsTimeline = song.lyricsTimeline || [];
        renderBothPanels();
        audio.load();
        audio.play().then(() => { isPlaying = true; fsPlayPause.innerHTML = '■'; mobilePlayPause.innerHTML = '■'; startAnimation(); }).catch(() => {});
        updatePlaylistModalUI();
    }
    function deleteSongById(id) {
        let idx = playlist.findIndex( => .id === id);
        if (idx === -1) return;
        const song = playlist[idx];
        if (song.audioUrl?.startsWith('blob:')) 网站.revokeObjectURL(song.audioUrl);
        if (song.coverUrl?.startsWith('blob:')) 网站.revokeObjectURL(song.coverUrl);
        playlist.splice(idx, 1);
        if (currentSongId === id) {
            if (playlist.length) playSongById(playlist[0].id);
            else {
                audio.pause(); isPlaying = false; fsPlayPause.innerHTML = '▶'; mobilePlayPause.innerHTML = '▶';
                audio.src = "";
                fsSongTitle.textContent = "暂无歌曲"; fsArtist.textContent = "点击菜单添加";
                mobileSongTitle.textContent = "暂无歌曲"; mobileArtist.textContent = "点击菜单添加";
                const def = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232c2e3a'/%3E%3Ctext x='50' y='55' font-size='12' fill='%23cbbfaa' text-anchor='middle'%3E🎵%3C/text%3E%3C/svg%3E";
                fsCoverImg.src = def; mobileCoverImg.src = def; updateBackgroundFromCover(def);
                currentLyricsTimeline = []; renderBothPanels();
                currentSongId = null;
            }
        }
        updatePlaylistModalUI();
    }
    function addNewSong(audioFile, lyricsFile, coverFile) {
        if (!audioFile) { alert("请选择音频文件"); return; }
        const audioUrl = 网站.createObjectURL(audioFile);
        let coverUrl = coverFile ? 网站.createObjectURL(coverFile) : 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Crect width=\'100\' height=\'100\' fill=\'%232c2e3a\'/%3E%3Ctext x=\'50\' y=\'55\' font-size=\'12\' fill=\'%23cbbfaa\' text-anchor=\'middle\'%3E🎵%3C/text%3E%3C/svg%3E';
        let songName = audioFile.name.replace(/\.(mp3|m4a|flac)$/i, '') || "未知歌曲";
        let artist = "未知艺术家";
        let lyricsTimeline = [];
        const finalize = (parsedName, parsedArtist, timeline) => {
            if (parsedName && parsedName !== "未知歌曲") songName = parsedName;
            if (parsedArtist && parsedArtist !== "未知艺术家") artist = parsedArtist;
            if (timeline?.length) lyricsTimeline = timeline;
            const newSong = { id: Date.now(), name: songName, artist: artist, audioUrl, coverUrl, lyricsTimeline };
            playlist.push(newSong);
            if (!currentSongId) playSongById(newSong.id);
            updatePlaylistModalUI();
        };
        if (lyricsFile) {
            const reader = new FileReader();
            reader.onload = (e) => { const { songName: lrcSong, artistAlbum, timeline } = parseLyricsFull(e.target.result); finalize(lrcSong, artistAlbum, timeline); };
            reader.readAsText(lyricsFile, "UTF-8");
        } else finalize(null, null, []);
    }
    
    // 一键添加《男模》
    async function addModelSong() {
        const basePath = '';
        const audioUrl = `${basePath}男模.mp3`;
        const lyricsUrl = `${basePath}男模.txt`;
        const coverUrl = `${basePath}男模.jpg`;
        const btn = demoSongBtn;
        const originalText = btn.textContent;
        btn.textContent = '⏳ 加载男模...';
        btn.style.opacity = '0.7';
        btn.style.pointerEvents = 'none';
        
        let lyricsTimeline = [];
        let songName = "男模";
        let artist = "未知艺术家";
        let coverDataUrl = null;
        
        try {
            const lyricsResponse = await fetch(lyricsUrl);
            if (lyricsResponse.ok) {
                const lyricsText = await lyricsResponse.text();
                const { songName: parsedName, artistAlbum, timeline } = parseLyricsFull(lyricsText);
                if (parsedName && parsedName !== "未知歌曲") songName = parsedName;
                if (artistAlbum && artistAlbum !== "未知艺术家") artist = artistAlbum;
                if (timeline && timeline.length) lyricsTimeline = timeline;
            }
        } catch (e) { console.warn("男模歌词加载失败", e); }
        
        try {
            const coverResponse = await fetch(coverUrl);
            if (coverResponse.ok) {
                const coverBlob = await coverResponse.blob();
                coverDataUrl = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.readAsDataURL(coverBlob);
                });
            }
        } catch (e) { console.warn("男模封面加载失败", e); }
        
        const coverFinal = coverDataUrl || 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Crect width=\'100\' height=\'100\' fill=\'%232c2e3a\'/%3E%3Ctext x=\'50\' y=\'55\' font-size=\'12\' fill=\'%23cbbfaa\' text-anchor=\'middle\'%3E🎵%3C/text%3E%3C/svg%3E';
        
        const newSong = { id: Date.now(), name: songName, artist: artist, audioUrl: audioUrl, coverUrl: coverFinal, lyricsTimeline: lyricsTimeline };
        playlist.push(newSong);
        if (!currentSongId) playSongById(newSong.id);
        updatePlaylistModalUI();
        
        btn.textContent = originalText;
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';
        alert(`✅ 《男模》已添加！\n歌名: ${songName}\n歌手: ${artist}\n歌词行数: ${lyricsTimeline.length}\n封面: ${coverDataUrl ? '已设置' : '使用默认'}`);
    }
    
    // 一键添加《今天你要嫁给我》
    async function addMarrySong() {
        const basePath = '';
        const audioUrl = `${basePath}今天你要嫁给我.mp3`;
        const lyricsUrl = `${basePath}今天你要嫁给我.txt`;
        const coverUrl = `${basePath}今天你要嫁给我.jpg`;
        const btn = marrySongBtn;
        const originalText = btn.textContent;
        btn.textContent = '⏳ 加载婚礼曲...';
        btn.style.opacity = '0.7';
        btn.style.pointerEvents = 'none';
        
        let lyricsTimeline = [];
        let songName = "今天你要嫁给我";
        let artist = "陶喆 / 蔡依林";
        let coverDataUrl = null;
        
        try {
            const lyricsResponse = await fetch(lyricsUrl);
            if (lyricsResponse.ok) {
                const lyricsText = await lyricsResponse.text();
                const { songName: parsedName, artistAlbum, timeline } = parseLyricsFull(lyricsText);
                if (parsedName && parsedName !== "未知歌曲") songName = parsedName;
                if (artistAlbum && artistAlbum !== "未知艺术家") artist = artistAlbum;
                if (timeline && timeline.length) lyricsTimeline = timeline;
            }
        } catch (e) { console.warn("歌词加载失败", e); }
        
        try {
            const coverResponse = await fetch(coverUrl);
            if (coverResponse.ok) {
                const coverBlob = await coverResponse.blob();
                coverDataUrl = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.readAsDataURL(coverBlob);
                });
            }
        } catch (e) { console.warn("封面加载失败", e); }
        
        const coverFinal = coverDataUrl || 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Crect width=\'100\' height=\'100\' fill=\'%232c2e3a\'/%3E%3Ctext x=\'50\' y=\'55\' font-size=\'12\' fill=\'%23cbbfaa\' text-anchor=\'middle\'%3E🎵%3C/text%3E%3C/svg%3E';
        
        const newSong = { id: Date.now(), name: songName, artist: artist, audioUrl: audioUrl, coverUrl: coverFinal, lyricsTimeline: lyricsTimeline };
        playlist.push(newSong);
        if (!currentSongId) playSongById(newSong.id);
        updatePlaylistModalUI();
        
        btn.textContent = originalText;
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';
        alert(`✅ 《今天你要嫁给我》已添加！\n歌名: ${songName}\n歌手: ${artist}\n歌词行数: ${lyricsTimeline.length}\n封面: ${coverDataUrl ? '已设置' : '使用默认'}`);
    }
    
    function updatePlaylistModalUI() {
        playlistModalList.innerHTML = '';
        if (playlist.length === 0) { playlistModalList.innerHTML = '<div style="text-align:center;opacity:0.6;padding:20px;">暂无歌曲，请点击下方添加</div>'; return; }
        playlist.forEach(song => {
            const div = document.createElement('div'); div.className = 'playlist-song-item';
            div.innerHTML = `<img class="playlist-song-cover" src="${song.coverUrl}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Crect width=\'100\' height=\'100\' fill=\'%232c2e3a\'/%3E%3Ctext x=\'50\' y=\'55\' font-size=\'12\' fill=\'%23cbbfaa\' text-anchor=\'middle\'%3E🎵%3C/text%3E%3C/svg%3E'"><div class="playlist-song-info"><div class="playlist-song-name">${escapeHtml(song.name)}</div><div class="playlist-song-artist">${escapeHtml(song.artist)}</div></div><button class="playlist-delete-btn" data-id="${song.id}">🗑️</button>`;
            div.querySelector('.playlist-delete-btn').addEventListener('click', (e) => { e.stopPropagation(); deleteSongById(song.id); });
            div.addEventListener('click', () => { playSongById(song.id); closePlaylistModal(); });
            playlistModalList.appendChild(div);
        });
    }
    function escapeHtml(str) { return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
    function showPlaylistModal() { playlistModal.classList.add('show'); updatePlaylistModalUI(); }
    function closePlaylistModal() { playlistModal.classList.remove('show'); }
    function handleModalAddSong() { const a = modalAudioFile.files[0], l = modalLyricsFile.files[0], c = modalCoverFile.files[0]; if (!a) { alert("请选择音频文件"); return; } addNewSong(a, l, c); modalAudioFile.value = ''; modalLyricsFile.value = ''; modalCoverFile.value = ''; closePlaylistModal(); }

    // 事件绑定
    fsPlayPause.addEventListener('click', togglePlayPause); mobilePlayPause.addEventListener('click', togglePlayPause);
    fsPrevBtn.addEventListener('click', prevSong); mobilePrevBtn.addEventListener('click', prevSong);
    fsNextBtn.addEventListener('click', nextSong); mobileNextBtn.addEventListener('click', nextSong);
    fsRepeatBtn.addEventListener('click', toggleRepeat); mobileRepeatBtn.addEventListener('click', toggleRepeat);
    fsMenuBtn.addEventListener('click', showPlaylistModal); mobileMenuBtn.addEventListener('click', showPlaylistModal);
    closePlaylistModalBtn.addEventListener('click', closePlaylistModal); modalAddSongBtn.addEventListener('click', handleModalAddSong);
    demoSongBtn.addEventListener('click', addModelSong);
    marrySongBtn.addEventListener('click', addMarrySong);
    window.addEventListener('click', (e) => { if (e.target === playlistModal) closePlaylistModal(); });
    fsProgressBg.addEventListener('click', (e) => { if (!audio.duration) return; const rect = fsProgressBg.getBoundingClientRect(); let p = (e.clientX - rect.left) / rect.width; p = Math.min(1, Math.max(0, p)); audio.currentTime = p * audio.duration; updateProgressAndTime(); });
    mobileProgressBg.addEventListener('click', (e) => { if (!audio.duration) return; const rect = mobileProgressBg.getBoundingClientRect(); let p = (e.clientX - rect.left) / rect.width; p = Math.min(1, Math.max(0, p)); audio.currentTime = p * audio.duration; updateProgressAndTime(); });
    audio.addEventListener('ended', () => {
        if (isRepeat && currentSongId) { audio.currentTime = 0; audio.play().catch(() => {}); }
        else if (playlist.length) { let idx = playlist.findIndex( => .id === currentSongId); let nextIdx = (idx + 1) % playlist.length; if (nextIdx === 0 && idx === playlist.length - 1) { audio.pause(); isPlaying = false; fsPlayPause.innerHTML = '▶'; mobilePlayPause.innerHTML = '▶'; if (animFrame) cancelAnimationFrame(animFrame); animFrame = null; } else playSongById(playlist[nextIdx].id); }
        else { audio.pause(); isPlaying = false; fsPlayPause.innerHTML = '▶'; mobilePlayPause.innerHTML = '▶'; if (animFrame) cancelAnimationFrame(animFrame); animFrame = null; }
    });
    audio.addEventListener('timeupdate', () => updateUIByPlaybackTime(audio.currentTime));

    renderBothPanels(); updateBackgroundFromCover(fsCoverImg.src); startAnimation();
    setInterval(() => { if (audio && audio.src && !audio.paused) updateUIByPlaybackTime(audio.currentTime); }, 150);
    updateUIByPlaybackTime(0);
    document.getElementById('fullscreenCoverTrigger').addEventListener('click', () => { appContainer.classList.toggle('web-fullscreen'); });
    document.getElementById('mobileCoverTrigger').addEventListener('click', () => { appContainer.classList.toggle('web-fullscreen'); });
    document.getElementById('fullscreenSongInfo').addEventListener('click', showPlaylistModal);
    document.getElementById('mobileSongInfo').addEventListener('click', showPlaylistModal);
</script>
</body>
</html>
