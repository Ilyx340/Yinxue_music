<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, view-fit=cover, user-scalable=no">
    <title>YinXue Music 网页版播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        *::-webkit-scrollbar { display: none; }

        .dynamic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(60px) saturate(1.6);
            transform: scale(1.05);
            transition: background-image 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            will-change: background-image;
        }

        .orbital-auras {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
            overflow: visible;
        }
        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.8;
            will-change: transform, left, top;
        }
        .glow-1 {
            width: 85vmax;
            height: 85vmax;
            background: radial-gradient(circle, rgba(255,200,120,0.7), rgba(255,120,80,0.4), transparent);
            animation: orbit1 14s infinite linear;
        }
        .glow-2 {
            width: 75vmax;
            height: 75vmax;
            background: radial-gradient(circle, rgba(140,120,240,0.75), rgba(80,180,230,0.5), transparent);
            animation: orbit2 18s infinite linear reverse;
        }
        .glow-3 {
            width: 95vmax;
            height: 65vmax;
            background: radial-gradient(circle, rgba(220,150,220,0.7), rgba(180,110,210,0.45), transparent);
            animation: orbit3 22s infinite linear;
        }
        .glow-4 {
            width: 70vmax;
            height: 70vmax;
            background: radial-gradient(circle, rgba(255,240,120,0.7), rgba(255,180,60,0.45), transparent);
            animation: orbit4 12s infinite linear reverse;
        }
        @keyframes orbit1 {
            0% { left: 10%; top: 20%; transform: translate(-50%, -50%) scale(1); }
            25% { left: 80%; top: 30%; transform: translate(-50%, -50%) scale(1.1); }
            50% { left: 70%; top: 70%; transform: translate(-50%, -50%) scale(0.95); }
            75% { left: 20%; top: 80%; transform: translate(-50%, -50%) scale(1.05); }
            100% { left: 10%; top: 20%; transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes orbit2 {
            0% { left: 85%; top: 15%; transform: translate(-50%, -50%) scale(1); }
            33% { left: 20%; top: 40%; transform: translate(-50%, -50%) scale(1.15); }
            66% { left: 50%; top: 85%; transform: translate(-50%, -50%) scale(0.9); }
            100% { left: 85%; top: 15%; transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes orbit3 {
            0% { left: 30%; top: 85%; transform: translate(-50%, -50%) scale(1); }
            50% { left: 70%; top: 20%; transform: translate(-50%, -50%) scale(1.2); }
            100% { left: 30%; top: 85%; transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes orbit4 {
            0% { left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.8); }
            25% { left: 15%; top: 30%; transform: translate(-50%, -50%) scale(1.1); }
            50% { left: 85%; top: 60%; transform: translate(-50%, -50%) scale(0.9); }
            75% { left: 40%; top: 85%; transform: translate(-50%, -50%) scale(1.05); }
            100% { left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.8); }
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: -1;
            backdrop-filter: brightness(0.85);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
            background: #0a0c12;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .player-app {
            width: 100%;
            height: 100vh;
            position: relative;
            z-index: 2;
        }

        .fullscreen-transition-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .fullscreen-transition-mask.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .transition-text {
            color: #fff;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0,122,255,0.5);
            opacity: 0;
            transform: translateY(40px);
        }
        .transition-text.animate {
            animation: textFlyInFadeOut 2s cubic-bezier(0.2, 0.9, 0.4, 1.2) forwards;
        }
        @keyframes textFlyInFadeOut {
            0% { opacity: 0; transform: translateY(40px); }
            20% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        .player-app.web-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            background: transparent;
        }
        .player-app.web-fullscreen .dynamic-bg,
        .player-app.web-fullscreen .bg-overlay,
        .player-app.web-fullscreen .orbital-auras {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -2;
        }
        .player-app.web-fullscreen .mobile-layout {
            display: none;
        }
        .player-app.web-fullscreen .desktop-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .desktop-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .fullscreen-glass {
            width: 85%;
            max-width: 1400px;
            background: rgba(12, 14, 20, 0.4);
            backdrop-filter: blur(32px);
            border-radius: 56px;
            border: 1px solid rgba(236, 217, 180, 0.25);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.4);
            display: flex;
            overflow: hidden;
        }
        .fs-left {
            flex: 1;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            background: transparent;
        }
        .fs-right {
            flex: 3;
            padding: 2rem 2rem 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(236, 217, 180, 0.25);
            background: transparent;
            overflow: hidden;
            height: 100%;
        }
        .fs-lyrics-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 6px;
            max-height: calc(85vh - 80px);
        }
        .fs-lyrics-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: stretch;
            padding-bottom: 2rem;
        }
        .fs-cover-img {
            width: 180px;
            height: 180px;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 18px 32px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.2);
        }
        .fs-cover-img:hover { transform: scale(1.02); }
        .fs-cover-img img { width: 100%; height: 100%; object-fit: cover; }
        .fs-song-meta { cursor: pointer; text-align: center; width: 100%; }
        .fs-song-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #F1E6D4, #DDCEB0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.25rem;
        }
        .fs-song-artist { font-size: 1rem; color: #d4cbbe; }
        .fs-controls {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
        }
        .fs-progress-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: #f0e3d0;
        }
        .fs-progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 245, 220, 0.3);
            border-radius: 20px;
            cursor: pointer;
        }
        .fs-progress-fill {
            width: 0%;
            height: 100%;
            background: #ecd9b4;
            border-radius: 20px;
        }
        .fs-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .fs-btn {
            background: rgba(255, 245, 225, 0.12);
            border: 1px solid rgba(255, 245, 225, 0.25);
            width: 52px;
            height: 52px;
            border-radius: 40px;
            font-size: 1.4rem;
            cursor: pointer;
            color: #f5e6d4;
            transition: all 0.2s ease;
        }
        .fs-btn.play-pause {
            background: #ecd9b4;
            border: none;
            color: #1e1b16;
            width: 64px;
            height: 64px;
            font-size: 1.8rem;
        }
        .fs-btn.repeat-active {
            background: rgba(236, 217, 180, 0.7);
            border-color: #ecd9b4;
            color: #fff;
        }

        .fs-lyric-item {
            width: 100%;
            transition: all 0.45s cubic-bezier(0.2, 0.85, 0.4, 1);
            cursor: pointer;
            opacity: 0.55;
            padding: 6px 0px 6px 0px;
        }
        .fs-lyric-item.left { text-align: left; }
        .fs-lyric-item.right { text-align: right; }
        .fs-lyric-item.center { text-align: center; }
        .fs-lyric-text-wrapper { display: inline-block; position: relative; }
        .fs-lyric-text {
            font-size: 1.4rem;
            color: #f0e2cf;
            display: inline-block;
            padding: 0 6px;
            transition: all 0.45s cubic-bezier(0.2, 0.85, 0.4, 1);
        }
        .fs-singer-name {
            font-size: 0.7rem;
            color: #f0e2cf;
            opacity: 0.8;
            margin: 0 4px;
            display: inline-block;
        }
        .fs-lyric-item.right .fs-singer-name { order: -1; margin-right: 8px; margin-left: 0; }
        .fs-lyric-item.left .fs-singer-name { margin-left: 8px; margin-right: 0; }
        .fs-lyric-item.center .fs-singer-name { display: none; }
        .fs-lyric-item.left .fs-lyric-text-wrapper { border-left: 2px solid transparent; padding-left: 12px; transition: border-color 0.45s cubic-bezier(0.2, 0.85, 0.4, 1); }
        .fs-lyric-item.right .fs-lyric-text-wrapper { border-right: 2px solid transparent; padding-right: 12px; transition: border-color 0.45s cubic-bezier(0.2, 0.85, 0.4, 1); }
        .fs-lyric-item.center .fs-lyric-text-wrapper { border-left: 2px solid transparent; border-right: 2px solid transparent; padding: 0 12px; transition: border-color 0.45s cubic-bezier(0.2, 0.85, 0.4, 1); }
        .fs-lyric-item.active .fs-lyric-text-wrapper { border-left-color: #ecd9b4; border-right-color: #ecd9b4; }
        .fs-lyric-item.active { opacity: 1; }
        .fs-lyric-item.active .fs-lyric-text {
            color: #FFF6E5;
            font-weight: 600;
            text-shadow: 0 0 4px rgba(236,217,180,0.3);
        }
        .fs-lyric-item.sung .fs-lyric-text { opacity: 0.2; font-size: 1.2rem; }
        .fs-interlude-dots { display: flex; gap: 10px; padding: 10px 0 10px 16px; }
        .fs-dot {
            width: 5px; height: 5px;
            background: #ecd9b4;
            border-radius: 50%;
            animation: breathe 2.2s infinite ease-in-out;
        }
        @keyframes breathe {
            0% { opacity: 0.3; transform: scale(0.7); }
            50% { opacity: 1; transform: scale(1.2); background-color: #ecd9b4; }
            100% { opacity: 0.3; transform: scale(0.7); }
        }
        .fs-interlude-dots.hidden { display: none; }

        .mobile-layout {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: rgba(12, 14, 20, 0.4);
            backdrop-filter: blur(28px);
        }
        .mobile-lyrics-header { padding: 1.2rem 1.2rem 0.5rem 1.2rem; flex-shrink: 0; }
        .mobile-lyrics-header .lyrics-header { font-size: 0.7rem; text-transform: uppercase; color: #cfc2a8; letter-spacing: 1px; }
        .mobile-layout .lyrics-container { flex: 1; overflow-y: auto; padding: 0 1.2rem 0.5rem 1.2rem; }
        .mobile-layout .lyrics-list { display: flex; flex-direction: column; gap: 1.2rem; align-items: stretch; padding-bottom: 2rem; }
        .lyric-item {
            width: 100%;
            transition: all 0.35s cubic-bezier(0.2, 0.85, 0.4, 1);
            line-height: 1.45;
            cursor: pointer;
            opacity: 0.55;
            padding: 4px 0px 4px 0px;
        }
        .lyric-item.left { text-align: left; }
        .lyric-item.right { text-align: right; }
        .lyric-item.center { text-align: center; }
        .lyric-text-wrapper { display: inline-block; position: relative; }
        .lyric-text {
            font-size: 1.1rem;
            color: #e8dccc;
            display: inline-block;
            padding: 0 6px;
            transition: all 0.35s cubic-bezier(0.2, 0.85, 0.4, 1);
        }
        .singer-name {
            font-size: 0.6rem;
            color: #e8dccc;
            opacity: 0.8;
            display: inline-block;
            letter-spacing: 0.5px;
        }
        .lyric-item.right .singer-name { order: -1; margin-right: 6px; margin-left: 0; }
        .lyric-item.left .singer-name { margin-left: 6px; margin-right: 0; }
        .lyric-item.center .singer-name { display: none; }
        .lyric-item.left .lyric-text-wrapper { border-left: 2px solid transparent; padding-left: 8px; transition: border-color 0.35s cubic-bezier(0.2, 0.85, 0.4, 1); }
        .lyric-item.right .lyric-text-wrapper { border-right: 2px solid transparent; padding-right: 8px; transition: border-color 0.35s cubic-bezier(0.2, 0.85, 0.4, 1); }
        .lyric-item.center .lyric-text-wrapper { border-left: 2px solid transparent; border-right: 2px solid transparent; padding: 0 8px; transition: border-color 0.35s cubic-bezier(0.2, 0.85, 0.4, 1); }
        .lyric-item.active .lyric-text-wrapper { border-left-color: #ecd9b4; border-right-color: #ecd9b4; }
        .lyric-item.active { opacity: 1; }
        .lyric-item.active .lyric-text {
            color: #FFF6E5;
            font-weight: 600;
            text-shadow: 0 0 4px rgba(236,217,180,0.3);
        }
        .lyric-item.sung .lyric-text { opacity: 0.2; font-size: 0.95rem; }
        .lyric-item.upcoming .lyric-text { opacity: 0.55; font-size: 1.05rem; }
        .interlude-dots { display: flex; gap: 10px; padding: 8px 0 8px 12px; }
        .dot {
            width: 5px; height: 5px;
            background: #ecd9b4;
            border-radius: 50%;
            animation: breathe 2.2s infinite ease-in-out;
        }
        .interlude-dots.hidden { display: none; }

        .mobile-layout .control-bar {
            background: rgba(8, 10, 16, 0.45);
            backdrop-filter: blur(28px);
            border-top: 1px solid rgba(236, 217, 180, 0.15);
            border-radius: 24px 24px 0 0;
            padding: 1rem 1.2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            flex-shrink: 0;
        }
        .info-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
        .song-info { flex: 1; cursor: pointer; touch-action: pan-y; }
        .song-title-bottom {
            font-size: 1.2rem;
            font-weight: 650;
            background: linear-gradient(135deg, #F1E6D4, #DDCEB0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .song-artist-bottom { font-size: 0.75rem; color: #cfc3ae; }
        .cover-thumb { width: 54px; height: 54px; border-radius: 16px; overflow: hidden; cursor: pointer; }
        .cover-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .progress-area { display: flex; align-items: center; gap: 10px; font-size: 0.7rem; color: #e2d4c0; }
        .progress-bar-bg { flex: 1; height: 3px; background: rgba(255, 245, 220, 0.3); border-radius: 20px; cursor: pointer; }
        .progress-fill { width: 0%; height: 100%; background: #ecd9b4; border-radius: 20px; }
        .buttons { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 0.2rem; }
        .ctrl-btn {
            background: rgba(255, 245, 225, 0.12);
            border: 1px solid rgba(255, 245, 225, 0.25);
            width: 44px;
            height: 44px;
            border-radius: 30px;
            font-size: 1.2rem;
            cursor: pointer;
            color: #f5e6d4;
            transition: all 0.2s ease;
        }
        .ctrl-btn.play-pause {
            background: #ecd9b4;
            border: none;
            color: #1e1b16;
            width: 54px;
            height: 54px;
            font-size: 1.5rem;
        }
        .ctrl-btn.repeat-active {
            background: rgba(236, 217, 180, 0.6);
            border-color: #ecd9b4;
            color: #fff;
        }

        @media (max-width: 900px) {
            .fullscreen-glass { width: 95%; }
            .fs-cover-img { width: 140px; height: 140px; }
            .fs-song-title { font-size: 1.5rem; }
            .fs-btn { width: 44px; height: 44px; font-size: 1.2rem; }
            .fs-btn.play-pause { width: 54px; height: 54px; font-size: 1.5rem; }
            .desktop-layout { display: none !important; }
            .mobile-layout { display: flex !important; }
            .player-app.web-fullscreen .mobile-layout { display: none !important; }
            .player-app.web-fullscreen .desktop-layout { display: flex !important; }
        }
        @media (min-width: 901px) {
            .mobile-layout { display: none !important; }
            .desktop-layout { display: flex !important; }
        }

        .playlist-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(24px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1100;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease, visibility 0s linear 0.3s;
        }
        .playlist-modal.show { visibility: visible; opacity: 1; transition: opacity 0.3s ease; }
        .playlist-modal-content {
            background: rgba(30, 32, 44, 0.75);
            backdrop-filter: blur(40px);
            border-radius: 48px;
            width: 90%;
            max-width: 750px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4);
            color: #f0e2cf;
        }
        .playlist-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 1.3rem;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 0.8rem;
        }
        .playlist-modal-header h3 { color: #ecd9b4; font-weight: 500; }
        .close-playlist-modal, .settings-back-btn {
            background: transparent !important;
            border: none !important;
            font-size: 1.2rem;
            cursor: pointer;
            color: #cfc3ae !important;
            transition: 0.2s;
            padding: 0;
            line-height: 1;
            margin-left: 12px;
        }
        .close-playlist-modal:hover, .settings-back-btn:hover { color: #ecd9b4 !important; }
        .settings-btn {
            background: rgba(236,217,180,0.15);
            border: none;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            color: #ecd9b4;
            margin-right: 12px;
            transition: 0.2s;
            padding: 4px 12px;
            border-radius: 40px;
        }
        .settings-btn:hover { background: rgba(236,217,180,0.3); color: #fff5e8; }
        .setting-group { margin-bottom: 1.5rem; }
        .setting-group label { display: block; font-size: 0.85rem; margin-bottom: 8px; color: #ecd9b4; font-weight: 500; }
        .setting-group input, .setting-group select {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(236,217,180,0.4);
            border-radius: 40px;
            padding: 8px 12px;
            color: white;
            font-size: 0.9rem;
        }
        /* 垂直滑块布局 */
        .eq-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 16px;
        }
        .eq-item {
            flex: 1;
            min-width: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .eq-label {
            font-size: 0.75rem;
            color: #ecd9b4;
            text-align: center;
        }
        /* 垂直滑块样式 */
        .eq-slider-vertical {
            -webkit-appearance: slider-vertical;
            width: 6px;
            height: 100px;
            background: rgba(236,217,180,0.3);
            border-radius: 10px;
            cursor: pointer;
        }
        .eq-slider-vertical::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ecd9b4;
            cursor: pointer;
        }
        .eq-value {
            font-size: 0.7rem;
            color: #ecd9b4;
        }
        .preset-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }
        .preset-btn, .reset-eq-btn {
            background: rgba(236,217,180,0.15);
            border: 1px solid rgba(236,217,180,0.3);
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 0.75rem;
            cursor: pointer;
            color: #cfc3ae;
            transition: 0.2s;
        }
        .preset-btn:hover, .reset-eq-btn:hover {
            background: rgba(236,217,180,0.35);

<script>
    // ---------- 歌词解析 ----------
    function parseLyricsFull(content) {
        if (content.charCodeAt(0) === 0xFEFF) content = content.slice(1);
        const lines = content.split(/\r?\n/).filter(l => l.trim());
        let songName = "未知歌曲", artistAlbum = "未知艺术家";
        if (lines.length >= 1) songName = lines[0].trim();
        if (lines.length >= 2) artistAlbum = lines[1].trim();
        const timeline = [];
        let currentAlign = "left";
        let currentSinger = "";
        for (let line of lines) {
            let dirMatch = line.match(/^\[(left|right|all|center)\]\s*(.*?)[：:]\s*$/);
            if (dirMatch) {
                const dir = dirMatch[1];
                let singerRaw = dirMatch[2].trim();
                if (dir === "left") { currentAlign = "left"; currentSinger = singerRaw || ""; }
                else if (dir === "right") { currentAlign = "right"; currentSinger = singerRaw || ""; }
                else if (dir === "all" || dir === "center") { currentAlign = "center"; currentSinger = ""; }
                continue;
            }
            let otherMatch = line.match(/^\[other\]\s*(.*?)[：:]\s*$/);
            if (otherMatch) {
                currentAlign = "left";
                currentSinger = otherMatch[1].trim() || "";
                continue;
            }
            const regex = /(?:\[)?(\d{1,2}):(\d{1,2})\.(\d{1,6})(?:\])?\s*(.+)/;
            const m = line.match(regex);
            if (m) {
                const minutes = parseInt(m[1], 10);
                const seconds = parseInt(m[2], 10);
                let msStr = m[3];
                let millis = parseInt(msStr, 10);
                if (isNaN(millis)) millis = 0;
                else if (msStr.length === 1) millis *= 100;
                else if (msStr.length === 2) millis *= 10;
                let text = m[4].trim();
                if (text) {
                    const timeSec = minutes * 60 + seconds + millis / 1000;
                    timeline.push({ time: parseFloat(timeSec.toFixed(3)), text, align: currentAlign, singer: currentSinger });
                }
            }
        }
        timeline.sort((a,b)=>a.time-b.time);
        return { songName, artistAlbum, timeline };
    }

    // ---------- Web Audio 均衡器 (8段) ----------
    let audioCtx = null, sourceNode = null, gainNode = null;
    let filters = [];
    let surroundEnabled = false;
    let pannerNode = null;
    let surroundAnim = null;
    let surroundTime = 0;

    const eqFreqs = [60, 150, 400, 1000, 2400, 6000, 10000, 16000];
    let eqValues = [0,0,0,0,0,0,0,0];

    function initAudioContext() {
        if (!audioCtx && window.AudioContext) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            gainNode = audioCtx.createGain();
            for (let i = 0; i < eqFreqs.length; i++) {
                let filter = audioCtx.createBiquadFilter();
                filter.type = 'peaking';
                filter.frequency.value = eqFreqs[i];
                filter.Q.value = 1;
                filter.gain.value = eqValues[i];
                filters.push(filter);
            }
            if (filters.length) {
                let prev = filters[0];
                for (let i = 1; i < filters.length; i++) {
                    filters[i-1].connect(filters[i]);
                }
                filters[filters.length-1].connect(gainNode);
            } else {
                gainNode.connect(audioCtx.destination);
            }
            gainNode.connect(audioCtx.destination);
        }
    }

    function applyEQ() {
        if (!filters.length) return;
        for (let i = 0; i < filters.length; i++) {
            filters[i].gain.value = eqValues[i];
        }
    }

    function setupSurround() {
        if (!audioCtx) return;
        if (surroundEnabled) {
            if (!pannerNode) {
                pannerNode = audioCtx.createStereoPanner();
                pannerNode.pan.value = 0;
            }
            if (filters.length) {
                filters[filters.length-1].disconnect();
                filters[filters.length-1].connect(pannerNode);
                pannerNode.connect(gainNode);
            } else {
                if (sourceNode) sourceNode.disconnect();
                sourceNode = audioCtx.createMediaElementSource(audio);
                sourceNode.connect(pannerNode);
                pannerNode.connect(gainNode);
            }
            startSurroundAnimation();
        } else {
            if (pannerNode) {
                pannerNode.disconnect();
                if (filters.length) {
                    filters[filters.length-1].disconnect();
                    filters[filters.length-1].connect(gainNode);
                } else if (sourceNode) {
                    sourceNode.disconnect();
                    sourceNode = audioCtx.createMediaElementSource(audio);
                    sourceNode.connect(gainNode);
                }
            }
            if (surroundAnim) cancelAnimationFrame(surroundAnim);
        }
    }

    function startSurroundAnimation() {
        if (surroundAnim) cancelAnimationFrame(surroundAnim);
        if (!surroundEnabled || !pannerNode) return;
        function animate() {
            if (!surroundEnabled || !pannerNode || !audioCtx || !audioCtx.destination) return;
            surroundTime += 0.016;
            const pan = Math.sin(surroundTime * 0.8) * 0.6;
            pannerNode.pan.value = pan;
            surroundAnim = requestAnimationFrame(animate);
        }
        animate();
    }

    function connectEQToAudio() {
        if (!audioCtx || !sourceNode) return;
        try {
            if (sourceNode.mediaElement) sourceNode.disconnect();
            sourceNode = audioCtx.createMediaElementSource(audio);
            if (filters.length) {
                sourceNode.connect(filters[0]);
            } else {
                sourceNode.connect(gainNode);
            }
            if (surroundEnabled && pannerNode) {
                if (filters.length) {
                    filters[filters.length-1].disconnect();
                    filters[filters.length-1].connect(pannerNode);
                    pannerNode.connect(gainNode);
                } else {
                    sourceNode.disconnect();
                    sourceNode.connect(pannerNode);
                    pannerNode.connect(gainNode);
                }
            }
            gainNode.gain.value = userSettings.volume / 100;
        } catch(e) { console.warn("EQ连接失败", e); }
    }

    // 预设
    const presets = {
        flat: [0,0,0,0,0,0,0,0],
        pop: [2,3,4,3,2,1,0,0],
        classical: [2,3,4,4,3,2,1,1],
        bassBoost: [6,5,4,0,0,0,0,0],
        trebleBoost: [0,0,0,0,2,4,5,6],
        bassCut: [-4,-3,-2,0,0,0,0,0],
        trebleCut: [0,0,0,0,-2,-3,-4,-5],
        guitar: [3,2,1,2,3,4,3,2]
    };
    function applyPreset(name) {
        const vals = presets[name];
        if (vals) {
            for (let i=0; i<eqValues.length; i++) eqValues[i] = vals[i];
            for (let i=0; i<eqSliders.length; i++) {
                eqSliders[i].value = eqValues[i];
                eqValuesDisplay[i].innerText = eqValues[i];
            }
            applyEQ();
            saveSettings();
        }
    }
    function resetEQ() {
        eqValues.fill(0);
        for (let i=0; i<eqSliders.length; i++) {
            eqSliders[i].value = 0;
            eqValuesDisplay[i].innerText = 0;
        }
        applyEQ();
        saveSettings();
    }

    let eqSliders = [], eqValuesDisplay = [];
    function buildEQGrid() {
        const container = document.getElementById('eqGrid');
        container.innerHTML = '';
        for (let i=0; i<eqFreqs.length; i++) {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'eq-item';
            const label = document.createElement('div');
            label.className = 'eq-label';
            label.innerText = eqFreqs[i] + 'Hz';
            const slider = document.createElement('input');
            slider.type = 'range';
            slider.min = -12;
            slider.max = 12;
            slider.step = 1;
            slider.value = eqValues[i];
            slider.classList.add('eq-slider-vertical');
            // 垂直滑块属性
            slider.style.height = '100px';
            slider.style.width = '6px';
            const valueSpan = document.createElement('span');
            valueSpan.className = 'eq-value';
            valueSpan.innerText = eqValues[i];
            slider.addEventListener('input', (idx => (e) => {
                eqValues[idx] = parseInt(e.target.value);
                valueSpan.innerText = eqValues[idx];
                applyEQ();
                saveSettings();
            })(i));
            itemDiv.appendChild(label);
            itemDiv.appendChild(slider);
            itemDiv.appendChild(valueSpan);
            container.appendChild(itemDiv);
            eqSliders.push(slider);
            eqValuesDisplay.push(valueSpan);
        }
    }

    // ---------- 播放器核心 ----------
    let playlist = [], currentSongId = null;
    let isPlaying = false, animFrame = null, isRepeat = false;
    let audio = new Audio();
    let userSettings = {
        volume: 80,
        lyricFontSize: 18,
        lyricOffset: 80,
        renderQuality: "high",
        idleTimeout: 0,
        surround: false,
        eqValues: [0,0,0,0,0,0,0,0]
    };
    let idleTimer = null;

    // DOM 元素引用
    const fsCoverImg = document.getElementById('fullscreenCoverImg'), fsSongTitle = document.getElementById('fullscreenSongTitle'), fsArtist = document.getElementById('fullscreenArtist');
    const fsPlayPause = document.getElementById('fullscreenPlayPause'), fsPrevBtn = document.getElementById('fullscreenPrevBtn'), fsNextBtn = document.getElementById('fullscreenNextBtn');
    const fsProgressFill = document.getElementById('fullscreenProgressFill'), fsProgressBg = document.getElementById('fullscreenProgressBg'), fsCurrentTime = document.getElementById('fullscreenCurrentTime'), fsDuration = document.getElementById('fullscreenDuration');
    const fsRepeatBtn = document.getElementById('fullscreenRepeatBtn'), fsMenuBtn = document.getElementById('fullscreenMenuBtn'), fsLyricsList = document.getElementById('fullscreenLyricsList'), fsLyricsScroll = document.getElementById('fullscreenLyricsScroll');
    const mobileCoverImg = document.getElementById('mobileCoverImg'), mobileSongTitle = document.getElementById('mobileSongTitle'), mobileArtist = document.getElementById('mobileArtist');
    const mobilePlayPause = document.getElementById('mobilePlayPause'), mobilePrevBtn = document.getElementById('mobilePrevBtn'), mobileNextBtn = document.getElementById('mobileNextBtn');
    const mobileProgressFill = document.getElementById('mobileProgressFill'), mobileProgressBg = document.getElementById('mobileProgressBg'), mobileCurrentTime = document.getElementById('mobileCurrentTime'), mobileDuration = document.getElementById('mobileDuration');
    const mobileRepeatBtn = document.getElementById('mobileRepeatBtn'), mobileMenuBtn = document.getElementById('mobileMenuBtn'), mobileLyricsList = document.getElementById('mobileLyricsList'), mobileLyricsContainer = document.getElementById('mobileLyricsContainer');
    const dynamicBg = document.getElementById('dynamicBg'), bgOverlay = document.getElementById('bgOverlay'), appContainer = document.getElementById('playerApp');
    const playlistModal = document.getElementById('playlistManagerModal'), closePlaylistModalBtn = document.getElementById('closePlaylistModalBtn');
    const modalAudioFile = document.getElementById('modalAudioFile'), modalLyricsFile = document.getElementById('modalLyricsFile'), modalCoverFile = document.getElementById('modalCoverFile');
    const modalAddSongBtn = document.getElementById('modalAddSongBtn'), playlistModalList = document.getElementById('playlistModalList');
    const demoSongBtn = document.getElementById('demoSongBtn'), marrySongBtn = document.getElementById('marrySongBtn');
    const transitionMask = document.getElementById('transitionMask'), transitionText = document.getElementById('transitionText');
    const openSettingsBtn = document.getElementById('openSettingsBtn'), backFromSettingsBtn = document.getElementById('backFromSettingsBtn');
    const mainPanelDiv = document.getElementById('mainPanel'), settingsPanelDiv = document.getElementById('settingsPanel');
    const volumeSlider = document.getElementById('volumeSlider'), lyricFontSizeSlider = document.getElementById('lyricFontSize'), lyricOffsetSlider = document.getElementById('lyricOffset');
    const renderQualitySelect = document.getElementById('renderQuality'), idleTimeoutInput = document.getElementById('idleTimeout');

    function formatTime(sec) { if (isNaN(sec)) return "0:00"; const m = Math.floor(sec / 60), s = Math.floor(sec % 60); return `${m}:${s < 10 ? '0' + s : s}`; }
    function updateBackgroundFromCover(src) {
        if (!src) return;
        dynamicBg.style.backgroundImage = `url('${src}')`;
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 50; canvas.height = 50;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, 50, 50);
            const data = ctx.getImageData(0, 0, 50, 50).data;
            let r = 0, g = 0, b = 0, count = 0;
            for (let i = 0; i < data.length; i += 4) { r += data[i]; g += data[i+1]; b += data[i+2]; count++; }
            r = Math.floor(r / count); g = Math.floor(g / count); b = Math.floor(b / count);
            bgOverlay.style.background = `linear-gradient(135deg, rgba(0,0,0,0.7), rgba(${r},${g},${b},0.68))`;
        };
        img.src = src;
    }

    function updateUIByPlaybackTime(currentSec) {
        fsDomItems.forEach(it => { if(it.type === 'interlude') { const inRange = (currentSec >= it.start && currentSec <= it.end); it.el.classList.toggle('hidden', !inRange); } });
        let activeIdx = -1;
        for (let i=0;i<fsDomItems.length;i++) if(fsDomItems[i].type === 'lyric' && fsDomItems[i].time <= currentSec) activeIdx=i;
        for (let i=0;i<fsDomItems.length;i++) {
            if(fsDomItems[i].type !== 'lyric') continue;
            const el = fsDomItems[i].el;
            if(fsDomItems[i].time <= currentSec) {
                if(i === activeIdx) { el.classList.add('active'); el.classList.remove('sung'); } 
                else { el.classList.add('sung'); el.classList.remove('active'); }
            } else { el.classList.remove('active','sung'); }
        }
        if(activeIdx !== -1 && activeIdx !== lastFsIdx) {
            const actEl = fsDomItems[activeIdx]?.el;
            if(actEl && fsLyricsScroll) {
                const containerRect = fsLyricsScroll.getBoundingClientRect();
                const elementRect = actEl.getBoundingClientRect();
                const offset = elementRect.top - (containerRect.top + containerRect.height / 2 - userSettings.lyricOffset);
                fsLyricsScroll.scrollBy({ top: offset, behavior: 'smooth' });
            }
            lastFsIdx = activeIdx;
        }
        mobileDomItems.forEach(it => { if(it.type === 'interlude') { const inRange = (currentSec >= it.start && currentSec <= it.end); it.el.classList.toggle('hidden', !inRange); } });
        let mobileActive = -1;
        for (let i=0;i<mobileDomItems.length;i++) if(mobileDomItems[i].type === 'lyric' && mobileDomItems[i].time <= currentSec) mobileActive=i;
        for (let i=0;i<mobileDomItems.length;i++) {
            if(mobileDomItems[i].type !== 'lyric') continue;
            const el = mobileDomItems[i].el;
            if(mobileDomItems[i].time <= currentSec) {
                if(i === mobileActive) { el.classList.add('active'); el.classList.remove('sung','upcoming'); }
                else { el.classList.add('sung'); el.classList.remove('active','upcoming'); }
            } else { el.classList.add('upcoming'); el.classList.remove('active','sung'); }
        }
        if(mobileActive !== -1 && mobileActive !== lastMobileIdx) {
            const actEl = mobileDomItems[mobileActive]?.el;
            if(actEl) {
                requestAnimationFrame(() => {
                    const cr = mobileLyricsContainer.getBoundingClientRect();
                    const er = actEl.getBoundingClientRect();
                    const offset = er.top - (cr.top + cr.height / 2 - userSettings.lyricOffset);
                    mobileLyricsContainer.scrollBy({ top: offset, behavior: 'smooth' });
                });
            }
            lastMobileIdx = mobileActive;
        }
    }

    function playSongById(id) {
        const song=playlist.find(s=>s.id===id);
        if(!song) return;
        if(audio.src) URL.revokeObjectURL(audio.src);
        audio.src=song.audioUrl;
        currentSongId=song.id;
        fsSongTitle.textContent=song.name; fsArtist.textContent=song.artist;
        mobileSongTitle.textContent=song.name; mobileArtist.textContent=song.artist;
        fsCoverImg.src=song.coverUrl; mobileCoverImg.src=song.coverUrl;
        updateBackgroundFromCover(song.coverUrl);
        currentLyricsTimeline=song.lyricsTimeline||[];
        renderBothPanels();
        audio.load();
        if(!audioCtx) initAudioContext();
        if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        setTimeout(() => {
            if (audioCtx) {
                sourceNode = audioCtx.createMediaElementSource(audio);
                if (filters.length) sourceNode.connect(filters[0]);
                else sourceNode.connect(gainNode);
                if (surroundEnabled && pannerNode) {
                    if (filters.length) {
                        filters[filters.length-1].disconnect();
                        filters[filters.length-1].connect(pannerNode);
                        pannerNode.connect(gainNode);
                    } else {
                        sourceNode.disconnect();
                        sourceNode.connect(pannerNode);
                        pannerNode.connect(gainNode);
                    }
                }
                gainNode.gain.value = userSettings.volume / 100;
            }
        }, 50);
        audio.volume = userSettings.volume / 100;
        audio.play().then(()=>{ isPlaying=true; fsPlayPause.innerHTML='■'; mobilePlayPause.innerHTML='■'; startAnimation(); }).catch(()=>{});
        updatePlaylistModalUI();
        onUserInteraction();
    }

        if (userSettings.eqValues) eqValues = [...userSettings.eqValues];

    function saveSettings() {
        userSettings.volume = parseInt(volumeSlider.value);
        userSettings.lyricFontSize = parseInt(lyricFontSizeSlider.value);
        userSettings.lyricOffset = parseInt(lyricOffsetSlider.value);
        userSettings.renderQuality = renderQualitySelect.value;
        userSettings.idleTimeout = parseInt(idleTimeoutInput.value);
        userSettings.surround = surroundToggle.checked;
        userSettings.eqValues = [...eqValues];
        localStorage.setItem('yinXueSettings', JSON.stringify(userSettings));
        if(gainNode) gainNode.gain.value = userSettings.volume / 100;
        else audio.volume = userSettings.volume / 100;
        applyLyricFontSize();
        applyRenderQuality();
        resetIdleTimer();

    function applyLyricFontSize() {
        const size = userSettings.lyricFontSize;
        document.querySelectorAll('.fs-lyric-text').forEach(el => el.style.fontSize = size + 'px');
        document.querySelectorAll('.lyric-text').forEach(el => el.style.fontSize = size + 'px');
        let style = document.getElementById('dynamic-font-style');
        if(style) style.remove();
        style = document.createElement('style');
        style.id = 'dynamic-font-style';
        style.textContent = `
            .fs-lyric-item.active .fs-lyric-text { font-size: ${size + 4}px !important; }
            .lyric-item.active .lyric-text { font-size: ${size + 2}px !important; }
        `;
        document.head.appendChild(style);

    function applyRenderQuality() {
        const auras = document.querySelectorAll('.glow');
        if(userSettings.renderQuality === 'high') {
            auras.forEach(el => el.style.display = 'block');
        } else if(userSettings.renderQuality === 'medium') {
            auras.forEach((el,idx) => { if(idx>=2) el.style.display = 'none'; else el.style.display = 'block'; });
        } else {
            auras.forEach(el => el.style.display = 'none');
        }
    }
    function resetIdleTimer() {
        if(idleTimer) clearTimeout(idleTimer);
        if(userSettings.idleTimeout > 0 && isPlaying) {
            idleTimer = setTimeout(() => {
                if(audio && !audio.paused) {
                    audio.pause();
                    isPlaying = false;
                    fsPlayPause.innerHTML = '▶';
                    mobilePlayPause.innerHTML = '▶';
                    if(animFrame) cancelAnimationFrame(animFrame);
                    animFrame = null;
                }
            }, userSettings.idleTimeout * 1000);

    fsProgressBg.addEventListener('click', (e)=>{ if(!audio.duration) return; const rect=fsProgressBg.getBoundingClientRect(); let p=(e.clientX-rect.left)/rect.width; p=Math.min(1,Math.max(0,p)); audio.currentTime=p*audio.duration; updateProgressAndTime(); onUserInteraction(); });
    mobileProgressBg.addEventListener('click', (e)=>{ if(!audio.duration) return; const rect=mobileProgressBg.getBoundingClientRect(); let p=(e.clientX-rect.left)/rect.width; p=Math.min(1,Math.max(0,p)); audio.currentTime=p*audio.duration; updateProgressAndTime(); onUserInteraction(); });
    audio.addEventListener('ended', () => {
        if(isRepeat && currentSongId){ audio.currentTime=0; audio.play().catch(()=>{}); }
        else if(playlist.length){ let idx=playlist.findIndex(s=>s.id===currentSongId); let nextIdx=(idx+1)%playlist.length; if(nextIdx===0 && idx===playlist.length-1){ audio.pause(); isPlaying=false; fsPlayPause.innerHTML='▶'; mobilePlayPause.innerHTML='▶'; if(animFrame) cancelAnimationFrame(animFrame); animFrame=null; } else playSongById(playlist[nextIdx].id); }
        else { audio.pause(); isPlaying=false; fsPlayPause.innerHTML='▶'; mobilePlayPause.innerHTML='▶'; if(animFrame) cancelAnimationFrame(animFrame); animFrame=null; }
        onUserInteraction();
    });
    audio.addEventListener('timeupdate', () => updateUIByPlaybackTime(audio.currentTime));

    window.addEventListener('click', onUserInteraction);
    window.addEventListener('touchstart', onUserInteraction);
    window.addEventListener('mousemove', onUserInteraction);

    // 初始化
    buildEQGrid();
    initAudioContext();
    loadSettings();
    renderBothPanels();
    updateBackgroundFromCover(fsCoverImg.src);
    startAnimation();
    setInterval(()=>{ if(audio && audio.src && !audio.paused) updateUIByPlaybackTime(audio.currentTime); }, 150);
    updateUIByPlaybackTime(0);
    document.getElementById('fullscreenCoverTrigger').addEventListener('click', () => { appContainer.classList.toggle('web-fullscreen'); onUserInteraction(); });
    document.getElementById('mobileCoverTrigger').addEventListener('click', () => { appContainer.classList.toggle('web-fullscreen'); onUserInteraction(); });
    document.getElementById('fullscreenSongInfo').addEventListener('click', showPlaylistModal);
    document.getElementById('mobileSongInfo').addEventListener('click', showPlaylistModal);
    openSettingsBtn.addEventListener('click', () => { mainPanelDiv.classList.add('hide'); settingsPanelDiv.classList.add('active'); });
    backFromSettingsBtn.addEventListener('click', () => { mainPanelDiv.classList.remove('hide'); settingsPanelDiv.classList.remove('active'); saveSettings(); });
    volumeSlider.addEventListener('input', () => { userSettings.volume = parseInt(volumeSlider.value); if(gainNode) gainNode.gain.value = userSettings.volume/100; else audio.volume = userSettings.volume/100; saveSettings(); onUserInteraction(); });
    lyricFontSizeSlider.addEventListener('input', () => { userSettings.lyricFontSize = parseInt(lyricFontSizeSlider.value); document.getElementById('fontSizeValue').innerText = userSettings.lyricFontSize+'px'; applyLyricFontSize(); saveSettings(); });
    lyricOffsetSlider.addEventListener('input', () => { userSettings.lyricOffset = parseInt(lyricOffsetSlider.value); document.getElementById('offsetValue').innerText = userSettings.lyricOffset+'px'; saveSettings(); });
    renderQualitySelect.addEventListener('change', () => { userSettings.renderQuality = renderQualitySelect.value; applyRenderQuality(); saveSettings(); });
    idleTimeoutInput.addEventListener('change', () => { userSettings.idleTimeout = parseInt(idleTimeoutInput.value); resetIdleTimer(); saveSettings(); });
    surroundToggle.addEventListener('change', () => { surroundEnabled = surroundToggle.checked; setupSurround(); saveSettings(); });
    document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const preset = btn.dataset.preset;
            if (preset === 'flat') resetEQ();
            else applyPreset(preset);
        });
    });
</script>
</body>
</html>
