<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, view-fit=cover, user-scalable=no">
    <title>YinXue Music 网页版播放器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dynamic-bg" id="dynamicBg"></div>
<div class="orbital-auras" id="orbitalAuras">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>
    <div class="glow glow-4"></div>
</div>
<div class="bg-overlay" id="bgOverlay"></div>
<div class="player-app" id="playerApp">
    <div class="desktop-layout" id="desktopLayout">
        <div class="fullscreen-glass">
            <div class="fs-left">
                <div class="fs-cover-img" id="fullscreenCoverTrigger"><img id="fullscreenCoverImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232c2e3a' rx='8'/%3E%3Ccircle cx='50' cy='42' r='14' fill='none' stroke='%23cbbfaa' stroke-width='2.5'/%3E%3Ccircle cx='50' cy='42' r='4' fill='%23cbbfaa'/%3E%3Cpath d='M 28 65 L 28 88' stroke='%23cbbfaa' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='28' cy='88' r='4' fill='%23cbbfaa'/%3E%3Cpath d='M 28 75 Q 28 68 40 68 L 72 68' stroke='%23cbbfaa' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='72' cy='88' r='4' fill='%23cbbfaa'/%3E%3C/svg%3E" alt="封面"></div>
                <div class="fs-song-meta" id="fullscreenSongInfo">
                    <div class="fs-song-title" id="fullscreenSongTitle">暂无歌曲</div>
                    <div class="fs-song-artist" id="fullscreenArtist">点击菜单添加</div>
                </div>
                <div class="fs-controls">
                    <div class="fs-progress-area">
                        <span class="time-current" id="fullscreenCurrentTime">0:00</span>
                        <div class="fs-progress-bar" id="fullscreenProgressBg"><div class="fs-progress-fill" id="fullscreenProgressFill"></div><div class="fs-progress-thumb" id="fullscreenProgressThumb"></div></div>
                        <span class="time-duration" id="fullscreenDuration">0:00</span>
                    </div>
                    <div class="fs-buttons">
                        <!-- 重复按钮 SVG -->
                        <button class="fs-btn" id="fullscreenRepeatBtn">
                            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9 9 0 0 1 9 9 9 9 0 0 1-9 9" stroke="currentColor" stroke-width="2" fill="none"/><polyline points="9 15 3 21 9 21" stroke="currentColor" stroke-width="2" fill="none"/><polyline points="15 9 21 3 15 3" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                        </button>
                        <!-- 上一首 SVG -->
                        <button class="fs-btn" id="fullscreenPrevBtn">
                            <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20" stroke="currentColor" stroke-width="2.2" fill="none"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.2"/></svg>
                        </button>
                        <!-- 播放/暂停 SVG -->
                        <button class="fs-btn play-pause" id="fullscreenPlayPause">
                            <svg viewBox="0 0 24 24" id="fullscreenPlayIcon"><polygon points="5 3 19 12 5 21 5 3" stroke="currentColor" stroke-width="2" fill="currentColor"/></svg>
                        </button>
                        <!-- 下一首 SVG -->
                        <button class="fs-btn" id="fullscreenNextBtn">
                            <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4" stroke="currentColor" stroke-width="2.2" fill="none"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.2"/></svg>
                        </button>
                        <!-- 菜单按钮 SVG -->
                        <button class="fs-btn" id="fullscreenMenuBtn">
                            <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2.2"/><line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2.2"/><line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2.2"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="fs-lyrics-separate">
            
            <div class="fs-lyrics-scroll" id="fullscreenLyricsScroll"><div class="fs-lyrics-list" id="fullscreenLyricsList"></div></div>
        </div>
    </div>

    <div class="mobile-layout" id="mobileLayout">
        <!-- 顶部歌曲信息栏 -->
        <div class="mobile-top-bar">
            <div class="info-row">
                <div class="cover-thumb" id="mobileCoverTrigger"><img id="mobileCoverImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232c2e3a' rx='8'/%3E%3Ccircle cx='50' cy='42' r='14' fill='none' stroke='%23cbbfaa' stroke-width='2.5'/%3E%3Ccircle cx='50' cy='42' r='4' fill='%23cbbfaa'/%3E%3Cpath d='M 28 65 L 28 88' stroke='%23cbbfaa' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='28' cy='88' r='4' fill='%23cbbfaa'/%3E%3Cpath d='M 28 75 Q 28 68 40 68 L 72 68' stroke='%23cbbfaa' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='72' cy='88' r='4' fill='%23cbbfaa'/%3E%3C/svg%3E" alt="封面"></div>
                <div class="song-info" id="mobileSongInfo">
                    <div class="song-title-top" id="mobileSongTitle">暂无歌曲</div>
                    <div class="song-artist-top" id="mobileArtist">点击菜单添加</div>
                </div>
            </div>
        </div>
        
        <!-- 歌词区域 -->
        <div class="lyrics-container" id="mobileLyricsContainer"><div class="lyrics-list" id="mobileLyricsList"></div></div>
        
        <!-- 底部控制栏 -->
        <div class="control-bar">
            <div class="progress-area">
                <span class="time-current" id="mobileCurrentTime">0:00</span>
                <div class="progress-bar-bg" id="mobileProgressBg"><div class="progress-fill" id="mobileProgressFill"></div><div class="progress-thumb" id="mobileProgressThumb"></div></div>
                <span class="time-duration" id="mobileDuration">0:00</span>
            </div>
            <div class="buttons">
                <!-- 重复按钮 SVG -->
                <button class="ctrl-btn" id="mobileRepeatBtn">
                    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9 9 0 0 1 9 9 9 9 0 0 1-9 9" stroke="currentColor" stroke-width="2" fill="none"/><polyline points="9 15 3 21 9 21" stroke="currentColor" stroke-width="2" fill="none"/><polyline points="15 9 21 3 15 3" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                </button>
                <!-- 上一首 SVG -->
                <button class="ctrl-btn" id="mobilePrevBtn">
                    <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20" stroke="currentColor" stroke-width="2.2" fill="none"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.2"/></svg>
                </button>
                <!-- 播放/暂停 SVG -->
                <button class="ctrl-btn play-pause" id="mobilePlayPause">
                    <svg viewBox="0 0 24 24" id="mobilePlayIcon"><polygon points="5 3 19 12 5 21 5 3" stroke="currentColor" stroke-width="2" fill="currentColor"/></svg>
                </button>
                <!-- 下一首 SVG -->
                <button class="ctrl-btn" id="mobileNextBtn">
                    <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4" stroke="currentColor" stroke-width="2.2" fill="none"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.2"/></svg>
                </button>
                <!-- 菜单按钮 SVG -->
                <button class="ctrl-btn" id="mobileMenuBtn">
                    <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2.2"/><line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2.2"/><line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2.2"/></svg>
                </button>
            </div>
        </div>
    </div>
</div>



<div id="homePage" class="home-page">
    <div class="home-sidebar">
        <div class="sidebar-top">
            <div class="sidebar-logo">YinXue<br><span>Music</span></div>
            <button class="sidebar-item active" data-view="search">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" fill="none"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2"/></svg>
                <span>搜索</span>
            </button>
            <button class="sidebar-item" data-view="recommend">
                <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke="currentColor" stroke-width="2" fill="none"/></svg>
                <span>推荐</span>
            </button>
            <button class="sidebar-item" data-view="ranking">
                <svg viewBox="0 0 24 24"><path d="M8 21V11M16 21V7M12 21V3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span>榜单</span>
            </button>
            <button class="sidebar-item" data-view="settings">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span>设置</span>
            </button>
        </div>
        <div class="sidebar-bottom">
            <div class="sidebar-player" id="sidebarPlayer">
                <div class="sidebar-player-cover" id="sidebarPlayerCover">
                    <img src="" referrerpolicy="origin" onerror="this.style.display='none'" />
                </div>
                <div class="sidebar-player-info">
                    <div class="sidebar-player-name" id="sidebarPlayerName">未播放</div>
                    <div class="sidebar-player-artist" id="sidebarPlayerArtist"></div>
                </div>
                <div class="sidebar-player-controls">
                    <button class="sidebar-player-btn" onclick="prevSong()">
                        <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20" stroke="currentColor" stroke-width="2.2" fill="none"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.2"/></svg>
                    </button>
                    <button class="sidebar-player-btn play-btn" id="sidebarPlayBtn" onclick="togglePlayPause()">
                        <svg viewBox="0 0 24 24" id="sidebarPlayIcon"><polygon points="5 3 19 12 5 21 5 3" stroke="currentColor" stroke-width="2" fill="currentColor"/></svg>
                    </button>
                    <button class="sidebar-player-btn" onclick="nextSong()">
                        <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4" stroke="currentColor" stroke-width="2.2" fill="none"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.2"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="home-main">
        <div class="home-main-header">
            <h2 id="homeViewTitle">搜索</h2>
        </div>
        <div class="home-view-content">
            <div class="home-view active" id="viewSearch">
                <div class="search-row">
                    <button class="search-back-btn" id="searchBackBtn" onclick="homeBackToSearch()" title="返回搜索结果">
                        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <div class="search-box-large">
                        <input id="homeSearchInput" placeholder="搜索歌曲、歌手..." onkeydown="if(event.key==='Enter') homeSearch()" />
                        <button onclick="homeSearch()">
                            <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" fill="none"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2"/></svg>
                        </button>
                    </div>
                </div>
                <div id="homeResults" class="home-results"></div>
                <div class="home-load-more-wrap">
                    <button class="home-load-more-btn hidden" id="homeLoadMoreBtn" onclick="homeSearchLoadMore()">加载更多</button>
                </div>
            </div>
            <div class="home-view" id="viewRecommend">
                <div class="section-block">
                    <div class="section-title">推荐歌曲</div>
                    <div id="homeRecommended" class="home-recommended-list"></div>
                </div>
                <div class="section-block">
                    <div class="section-title">热门专辑</div>
                    <div id="homeAlbums" class="home-album-grid"></div>
                </div>
                <div class="section-block">
                    <div class="section-title">热门歌手</div>
                    <div id="homeArtists" class="home-artist-grid"></div>
                </div>
            </div>
            <div class="home-view" id="viewRanking">
                <div class="ranking-container" id="homeRanking"></div>
            </div>
            <div class="home-view" id="viewLyrics">
                <div class="lyrics-view-container">
                    <div class="lyrics-song-list" id="lyricsSongList"></div>
                </div>
            </div>
            <div class="home-view" id="viewSettings">
                <div class="setting-group">
                    <label>均衡器 (EQ)</label>
                    <div class="eq-grid" id="eqGrid"></div>
                    <div class="preset-buttons">
                        <button class="preset-btn" data-preset="flat">复位</button>
                        <button class="preset-btn" data-preset="pop">流行</button>
                        <button class="preset-btn" data-preset="classical">古典</button>
                        <button class="preset-btn" data-preset="bassBoost">低音增强</button>
                        <button class="preset-btn" data-preset="trebleBoost">高音增强</button>
                        <button class="preset-btn" data-preset="bassCut">低音减弱</button>
                        <button class="preset-btn" data-preset="trebleCut">高音减弱</button>
                        <button class="preset-btn" data-preset="guitar">吉他</button>
                        <button class="preset-btn" data-preset="vocalClear">清澈人声</button>
                    </div>
                </div>
                <div class="setting-group">
                    <label>浅色模式</label>
                    <div class="toggle-switch">
                        <span>浅色主题</span>
                        <input type="checkbox" id="lightModeToggle">
                    </div>
                    <small class="setting-help">提高文字可读性，全屏歌词保持深色</small>
                </div>
                <div class="setting-group">
                    <label>3D 环绕</label>
                    <div class="toggle-switch">
                        <span>环绕效果</span>
                        <input type="checkbox" id="surroundToggle">
                    </div>
                    <small class="setting-help">模拟空间感，扩展声场</small>
                </div>
                <div class="setting-group">
                    <label>音量</label>
                    <input type="range" id="volumeSlider" min="0" max="100" value="80">
                </div>
                <div class="setting-group">
                    <label>歌词字体大小 (px)</label>
                    <input type="range" id="lyricFontSize" min="12" max="32" value="18" step="1">
                    <span id="fontSizeValue" class="range-value">18px</span>
                </div>
                <div class="setting-group">
                    <label>歌词垂直偏移量 (px) 0~150</label>
                    <input type="range" id="lyricOffset" min="0" max="150" value="80" step="1">
                    <span id="offsetValue" class="range-value">80px</span>
                </div>
                <div class="setting-group">
                    <label>动画渲染精度</label>
                    <select id="renderQuality">
                        <option value="high">高 (流畅光晕+全帧率)</option>
                        <option value="medium">中 (光晕减少)</option>
                        <option value="low">低 (节能)</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="playlistManagerModal" class="playlist-modal">
    <div class="playlist-modal-content" id="modalContent">
        <div id="mainPanel" class="main-panel">
            <div class="playlist-modal-header">
                <h3>播放列表管理器</h3>
                <div>
                    <button class="close-playlist-modal" id="closePlaylistModalBtn">
                        <svg viewBox="0 0 24 24"><line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.2"/><line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="2.2"/></svg>
                    </button>
                </div>
            </div>
            <div class="playlist-song-list" id="playlistModalList"></div>
        </div>
        <div id="wyySearchPanel" class="wyy-search-panel">
            <div class="playlist-modal-header">
                <h3>网易云音乐搜索</h3>
                <button class="settings-back-btn" id="backFromWyySearchBtn">← 返回</button>
            </div>
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
                <div class="wyy-api-badge" id="wyyApiBadge">
                    <span class="wyy-dot"></span>
                    <span id="wyyApiStatusText">检测中...</span>
                </div>
            </div>
            <div class="wyy-status" id="wyyStatus">搜索歌曲，点击添加到播放</div>
            <div class="wyy-search-box">
                <input id="wyySearchInput" placeholder="输入歌名或歌手..." value="周杰伦" onkeydown="if(event.key==='Enter') wyySearch()" />
                <button id="wyySearchBtn2" onclick="wyySearch()">搜索</button>
            </div>
            <div class="wyy-quick-tags">
                <button onclick="wyyQuickSearch('周杰伦')">周杰伦</button>
                <button onclick="wyyQuickSearch('林俊杰')">林俊杰</button>
                <button onclick="wyyQuickSearch('邓紫棋')">邓紫棋</button>
                <button onclick="wyyQuickSearch('陈奕迅')">陈奕迅</button>
                <button onclick="wyyQuickSearch('晴天')">晴天</button>
                <button onclick="wyyQuickSearch('孤勇者')">孤勇者</button>
                <button onclick="wyyQuickSearch('起风了')">起风了</button>
            </div>
            <div id="wyyResults" class="wyy-results"></div>
            <div id="wyyLoadMore" class="wyy-load-more hidden" onclick="wyyLoadMore()">加载更多</div>
            <div class="wyy-api-info">接口：/search · /song/detail (批量) · /song/url/v1 · /lyric</div>
        </div>
    </div> 
</div>
<script src="script.js"></script>
</body>
</html>
