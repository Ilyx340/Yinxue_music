<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, view-fit=cover, user-scalable=no">
    <title>YinXue Music · By英雪</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        /* 动态背景层 — 始终位于最底层，全屏时依然有效 */
        .dynamic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(60px) saturate(1.6);
            transform: scale(1.05);
            transition: background-image 0.5ease;
        }
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: -1;
            backdrop-filter: brightness(0.9);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
            background: #0a0c12;
            overflow: hidden;
        }

        .player-app {
            width: 100%;
            height: 100vh;
            position: relative;
            z-index: 2;
            transition: all 0.4cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        /* 网页全屏样式 */
        .player-app.web-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            background: transparent;
        }
        .player-app.web-fullscreen .dynamic-bg,
        .player-app.web-fullscreen .bg-overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -2;
        }
        .player-app.web-fullscreen .mobile-layout {
            display: none;
        }
        .player-app.web-fullscreen .desktop-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* 非全屏下移动端布局显示，桌面布局隐藏 */
        .mobile-layout {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: rgba(15, 17, 24, 0.65);
            backdrop-filter: blur(28px);
        }
        .desktop-layout {
            display: none;
        }

        /* 全屏布局：单一圆角毛玻璃容器，左右分区 */
        .fullscreen-glass {
            width: 85%;
            max-width: 1400px;
            background: rgba(12, 14, 20, 0.4);
            backdrop-filter: blur(28px);
            border-radius: 56px;
            border: 1px solid rgba(255, 245, 220, 0.2);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.4);
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* 左侧区域 (MIC: 封面+信息+控制器) */
        .fs-left {
            flex: 1;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2rem;
            background: transparent;
        }

        /* 右侧歌词区域 — 确保可滚动，隐藏滚动条 */
        .fs-right {
            flex: 3;
            padding: 2rem 2rem 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(255, 245, 220, 0.25);
            background: transparent;
            overflow: hidden;
            height: 100%;
        }
        .fs-lyrics-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 6px;
            max-height: calc(85vh - 80px);
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .fs-lyrics-scroll::-webkit-scrollbar {
            display: none;
        }
        .fs-lyrics-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: flex-start;
            padding-bottom: 2rem;
        }

        /* 封面样式 */
        .fs-cover {
            display: flex;
            justify-content: center;
        }
        .fs-cover-img {
            width: 180px;
            height: 180px;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 18px 32px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .fs-cover-img:hover {
            transform: scale(1.02);
        }
        .fs-cover-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 歌曲信息 */
        .fs-song-meta {
            cursor: pointer;
            text-align: center;
            touch-action: pan-y;
        }
        .fs-song-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #F1E6D4, #DDCEB0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.25rem;
        }
        .fs-song-artist {
            font-size: 1rem;
            color: #d4cbbe;
        }

        /* 控制器 */
        .fs-controls {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .fs-progress-area {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: #f0e3d0;
        }
        .fs-progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255, 245, 220, 0.3);
            border-radius: 20px;
            cursor: pointer;
        }
        .fs-progress-fill {
            width: 0%;
            height: 100%;
            background: #ecd9b4;
            border-radius: 20px;
        }
        .fs-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .fs-btn {
            background: rgba(255, 245, 225, 0.15);
            border: 1px solid rgba(255, 245, 225, 0.3);
            width: 52px;
            height: 52px;
            border-radius: 40px;
            font-size: 1.4rem;
            cursor: pointer;
            color: #f5e6d4;
            transition: 0.2s;
        }
        .fs-btn.play-pause {
            background: #ecd9b4;
            border: none;
            color: #1e1b16;
            width: 64px;
            height: 64px;
            font-size: 1.8rem;
        }
        .fs-btn.repeat-active {
            background: rgba(236, 217, 180, 0.7);
            border-color: #ecd9b4;
            color: #fff;
        }

        /* 歌词条目样式 — 字体增大 */
        .fs-lyric-item {
            font-size: 1.4rem;
            color: #f0e2cf;
            opacity: 0.55;
            padding: 8px 0 8px 16px;
            border-left: 2px solid transparent;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }
        .fs-lyric-item.active {
            opacity: 1;
            color: #FFF6E5;
            font-size: 1.8rem;
            font-weight: 600;
            border-left: 3px solid #ecd9b4;
        }
        .fs-lyric-item.sung {
            opacity: 0.2;
            font-size: 1.2rem;
        }
        .fs-interlude-dots {
            display: flex;
            gap: 10px;
            padding: 10px 0 10px 16px;
        }
        .fs-dot {
            width: 5px;
            height: 5px;
            background: #ecd9b4;
            border-radius: 50%;
            animation: breathe 2s infinite;
        }
        @keyframes breathe {
            0% { opacity: 0.3; transform: scale(0.7); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.3; transform: scale(0.7); }
        }
        .fs-interlude-dots.hidden { display: none; }

        /* 响应式调整 */
        @media (max-width: 900px) {
            .fullscreen-glass { width: 95%; }
            .fs-cover-img { width: 140px; height: 140px; }
            .fs-song-title { font-size: 1.5rem; }
            .fs-btn { width: 44px; height: 44px; font-size: 1.2rem; }
            .fs-btn.play-pause { width: 54px; height: 54px; font-size: 1.5rem; }
            .fs-lyric-item { font-size: 1.2rem; }
            .fs-lyric-item.active { font-size: 1.5rem; }
            .fs-lyrics-scroll { max-height: calc(85vh - 60px); }
        }

        /* 移动端原有样式 — 同样隐藏滚动条 */
        .mobile-layout .lyrics-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 1.2rem 0.8rem;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .mobile-layout .lyrics-container::-webkit-scrollbar {
            display: none;
        }
        .mobile-layout .lyrics-header {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #cfc2a8;
            margin-bottom: 0.6rem;
        }
        .mobile-layout .lyrics-scroll-area {
            overflow-y: auto;
            height: 100%;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .mobile-layout .lyrics-scroll-area::-webkit-scrollbar {
            display: none;
        }
        .mobile-layout .lyrics-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: flex-start;
            padding-bottom: 2rem;
        }
        .mobile-layout .lyric-item {
            font-size: 1.2rem;
            color: #e8dccc;
            opacity: 0.5;
            padding: 6px 0px 6px 14px;
            border-left: 2px solid transparent;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }
        .mobile-layout .lyric-item.active {
            opacity: 1;
            color: #FFF6E5;
            font-size: 1.45rem;
            font-weight: 600;
            border-left: 3px solid #ecd9b4;
        }
        .mobile-layout .lyric-item.sung {
            opacity: 0.2;
            font-size: 0.95rem;
        }
        .mobile-layout .interlude-dots {
            display: flex;
            gap: 10px;
            padding: 12px 0 12px 14px;
        }
        .mobile-layout .dot {
            width: 5px;
            height: 5px;
            background: #ecd9b4;
            border-radius: 50%;
            animation: breathe 2s infinite;
        }
        .mobile-layout .interlude-dots.hidden { display: none; }
        .mobile-layout .control-bar {
            background: rgba(8, 10, 16, 0.7);
            backdrop-filter: blur(28px);
            border-top: 1px solid rgba(255, 245, 215, 0.15);
            padding: 1rem 1.2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .mobile-layout .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        .mobile-layout .song-info {
            flex: 1;
            cursor: pointer;
            touch-action: pan-y;
        }
        .mobile-layout .song-title-bottom {
            font-size: 1.2rem;
            font-weight: 650;
            background: linear-gradient(135deg, #F1E6D4, #DDCEB0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .mobile-layout .song-artist-bottom {
            font-size: 0.75rem;
            color: #cfc3ae;
        }
        .mobile-layout .cover-thumb {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
        }
        .mobile-layout .cover-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .mobile-layout .progress-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.7rem;
            color: #e2d4c0;
        }
        .mobile-layout .progress-bar-bg {
            flex: 1;
            height: 3px;
            background: rgba(255, 245, 220, 0.3);
            border-radius: 20px;
            cursor: pointer;
        }
        .mobile-layout .progress-fill {
            width: 0%;
            height: 100%;
            background: #ecd9b4;
            border-radius: 20px;
        }
        .mobile-layout .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 0.2rem;
        }
        .mobile-layout .ctrl-btn {
            background: rgba(255, 245, 225, 0.12);
            border: 1px solid rgba(255, 245, 225, 0.25);
            width: 44px;
            height: 44px;
            border-radius: 30px;
            font-size: 1.2rem;
            cursor: pointer;
            color: #f5e6d4;
        }
        .mobile-layout .ctrl-btn.play-pause {
            background: #ecd9b4;
            border: none;
            color: #1e1b16;
            width: 54px;
            height: 54px;
            font-size: 1.5rem;
        }
        .mobile-layout .ctrl-btn.repeat-active {
            background: rgba(236, 217, 180, 0.6);
            border-color: #ecd9b4;
            color: #fff;
        }

        /* 播放列表模态框 */
        .playlist-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1100;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .playlist-modal.show {
            visibility: visible;
            opacity: 1;
        }
        .playlist-modal-content {
            background: rgba(20,22,32,0.96);
            backdrop-filter: blur(20px);
            border-radius: 36px;
            width: 90%;
            max-width: 650px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 1.5rem;
            border: 1px solid rgba(255,245,200,0.2);
            color: #f0e2cf;
        }
        .playlist-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            font-size: 1.3rem;
            font-weight: 600;
            border-bottom: 1px solid rgba(255,245,200,0.2);
            padding-bottom: 0.8rem;
        }
        .playlist-modal-header h3 {
            color: #ecd9b4;
        }
        .close-playlist-modal {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #b8aa8c;
        }
        .playlist-song-list {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 1rem;
        }
        .playlist-song-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,245,220,0.08);
            border-radius: 60px;
            padding: 10px 16px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .playlist-song-item:hover {
            background: rgba(236,217,180,0.2);
        }
        .playlist-song-info {
            flex: 1;
        }
        .playlist-song-name {
            font-weight: 600;
        }
        .playlist-song-artist {
            font-size: 0.75rem;
            opacity: 0.7;
        }
        .playlist-delete-btn {
            background: none;
            border: none;
            color: #b8aa8c;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
        }
        .playlist-add-section {
            border-top: 1px solid rgba(255,245,200,0.2);
            padding-top: 1rem;
            margin-top: 0.5rem;
        }
        .playlist-add-title {
            font-size: 0.9rem;
            margin-bottom: 0.8rem;
            color: #ecd9b4;
        }
        .file-input-group {
            margin: 10px 0;
        }
        .file-label {
            display: block;
            font-size: 0.75rem;
            opacity: 0.8;
            margin-bottom: 4px;
        }
        .playlist-modal input[type="file"] {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,245,200,0.3);
            border-radius: 40px;
            padding: 8px 12px;
            width: 100%;
            color: white;
        }
        .add-song-submit {
            background: #ecd9b4;
            border: none;
            border-radius: 40px;
            padding: 10px 20px;
            color: #1e1b16;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
    </style>
</head>
<body>
<div class="dynamic-bg" id="dynamicBg"></div>
<div class="bg-overlay" id="bgOverlay"></div>
<div class="player-app" id="playerApp">
    <!-- 全屏布局 (网页全屏时显示) -->
    <div class="desktop-layout" id="desktopLayout">
        <div class="fullscreen-glass">
            <div class="fs-left">
                <div class="fs-cover">
                    <div class="fs-cover-img" id="fullscreenCoverTrigger">
                        <img id="fullscreenCoverImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232c2e3a'/%3E%3Ctext x='50' y='55' font-size='12' fill='%23cbbfaa' text-anchor='middle'%3E🎵%3C/text%3E%3C/svg%3E" alt="封面">
                    </div>
                </div>
                <div class="fs-song-meta" id="fullscreenSongInfo">
                    <div class="fs-song-title" id="fullscreenSongTitle">暂无歌曲</div>
                    <div class="fs-song-artist" id="fullscreenArtist">点击菜单添加</div>
                </div>
                <div class="fs-controls">
                    <div class="fs-progress-area">
                        <span class="time-current" id="fullscreenCurrentTime">0:00</span>
                        <div class="fs-progress-bar" id="fullscreenProgressBg">
                            <div class="fs-progress-fill" id="fullscreenProgressFill"></div>
                        </div>
                        <span class="time-duration" id="fullscreenDuration">0:00</span>
                    </div>
                    <div class="fs-buttons">
                        <button class="fs-btn" id="fullscreenRepeatBtn" title="单曲循环">↻</button>
                        <button class="fs-btn" id="fullscreenPrevBtn" title="上一首">⏮</button>
                        <button class="fs-btn play-pause" id="fullscreenPlayPause">▶</button>
                        <button class="fs-btn" id="fullscreenNextBtn" title="下一首">⏭</button>
                        <button class="fs-btn" id="fullscreenMenuBtn" title="播放列表">☰</button>
                    </div>
                </div>
            </div>
            <div class="fs-right">
                <!-- 标题改为 YinXue Music，与歌词同色 -->
                <div class="fs-lyrics-header" style="color: #f0e2cf; opacity: 0.8;">✦ YinXue Music</div>
                <div class="fs-lyrics-scroll" id="fullscreenLyricsScroll">
                    <div class="fs-lyrics-list" id="fullscreenLyricsList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 移动端常规布局 (非全屏时显示) -->
    <div class="mobile-layout" id="mobileLayout">
        <div class="lyrics-container">
            <div class="lyrics-header">✦ YinXue Music α¹²⁶</div>
            <div class="lyrics-scroll-area" id="mobileLyricsArea">
                <div class="lyrics-list" id="mobileLyricsList"></div>
            </div>
        </div>
        <div class="control-bar">
            <div class="info-row">
                <div class="song-info" id="mobileSongInfo">
                    <div class="song-title-bottom" id="mobileSongTitle">暂无歌曲</div>
                    <div class="song-artist-bottom" id="mobileArtist">点击菜单添加</div>
                </div>
                <div class="cover-thumb" id="mobileCoverTrigger">
                    <img id="mobileCoverImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232c2e3a'/%3E%3Ctext x='50' y='55' font-size='12' fill='%23cbbfaa' text-anchor='middle'%3E🎵%3C/text%3E%3C/svg%3E" alt="封面">
                </div>
            </div>
            <div class="progress-area">
                <span class="time-current" id="mobileCurrentTime">0:00</span>
                <div class="progress-bar-bg" id="mobileProgressBg">
                    <div class="progress-fill" id="mobileProgressFill"></div>
                </div>
                <span class="time-duration" id="mobileDuration">0:00</span>
            </div>
            <div class="buttons">
                <button class="ctrl-btn" id="mobileRepeatBtn" title="单曲循环">↻</button>
                <button class="ctrl-btn" id="mobilePrevBtn" title="上一首">⏮</button>
                <button class="ctrl-btn play-pause" id="mobilePlayPause">▶</button>
                <button class="ctrl-btn" id="mobileNextBtn" title="下一首">⏭</button>
                <button class="ctrl-btn" id="mobileMenuBtn" title="播放列表">☰</button>
            </div>
        </div>
    </div>
</div>

<!-- 播放列表管理器模态框 -->
<div id="playlistManagerModal" class="playlist-modal">
    <div class="playlist-modal-content">
        <div class="playlist-modal-header">
            <h3>播放列表管理器</h3>
            <button class="close-playlist-modal" id="closePlaylistModalBtn">&times;</button>
        </div>
        <div class="playlist-song-list" id="playlistModalList"></div>
        <div class="playlist-add-section">
            <div class="playlist-add-title">✚ 添加新歌曲</div>
            <div class="file-input-group">
                <label class="file-label">♫ 音频文件</label>
                <input type="file" id="modalAudioFile" accept="audio/mpeg,audio/mp3">
            </div>
            <div class="file-input-group">
                <label class="file-label">☵ 歌词文件</label>
                <input type="file" id="modalLyricsFile" accept="text/plain">
            </div>
            <div class="file-input-group">
                <label class="file-label">₪ 专辑封面</label>
                <input type="file" id="modalCoverFile" accept="image/jpeg,image/png,image/webp">
            </div>
            <button class="add-song-submit" id="modalAddSongBtn">添加到播放列表</button>
        </div>
    </div>
</div>

<script>
    // ---------- 数据结构 ----------
    let playlist = [];
    let currentSongId = null;
    let audio = new Audio();
    let isPlaying = false, animFrame = null;
    let isRepeat = false;

    // ---------- DOM 元素 ----------
    // 全屏布局
    const fsCoverImg = document.getElementById('fullscreenCoverImg');
    const fsSongTitle = document.getElementById('fullscreenSongTitle');
    const fsArtist = document.getElementById('fullscreenArtist');
    const fsPlayPause = document.getElementById('fullscreenPlayPause');
    const fsPrevBtn = document.getElementById('fullscreenPrevBtn');
    const fsNextBtn = document.getElementById('fullscreenNextBtn');
    const fsProgressFill = document.getElementById('fullscreenProgressFill');
    const fsProgressBg = document.getElementById('fullscreenProgressBg');
    const fsCurrentTime = document.getElementById('fullscreenCurrentTime');
    const fsDuration = document.getElementById('fullscreenDuration');
    const fsRepeatBtn = document.getElementById('fullscreenRepeatBtn');
    const fsMenuBtn = document.getElementById('fullscreenMenuBtn');
    const fsLyricsList = document.getElementById('fullscreenLyricsList');
    const fsLyricsScroll = document.getElementById('fullscreenLyricsScroll');
    // 移动端
    const mobileCoverImg = document.getElementById('mobileCoverImg');
    const mobileSongTitle = document.getElementById('mobileSongTitle');
    const mobileArtist = document.getElementById('mobileArtist');
    const mobilePlayPause = document.getElementById('mobilePlayPause');
    const mobilePrevBtn = document.getElementById('mobilePrevBtn');
    const mobileNextBtn = document.getElementById('mobileNextBtn');
    const mobileProgressFill = document.getElementById('mobileProgressFill');
    const mobileProgressBg = document.getElementById('mobileProgressBg');
    const mobileCurrentTime = document.getElementById('mobileCurrentTime');
    const mobileDuration = document.getElementById('mobileDuration');
    const mobileRepeatBtn = document.getElementById('mobileRepeatBtn');
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileLyricsList = document.getElementById('mobileLyricsList');
    const mobileLyricsArea = document.getElementById('mobileLyricsArea');
    // 公用
    const dynamicBg = document.getElementById('dynamicBg');
    const bgOverlay = document.getElementById('bgOverlay');
    const appContainer = document.getElementById('playerApp');
    const playlistModal = document.getElementById('playlistManagerModal');
    const closePlaylistModalBtn = document.getElementById('closePlaylistModalBtn');
    const modalAudioFile = document.getElementById('modalAudioFile');
    const modalLyricsFile = document.getElementById('modalLyricsFile');
    const modalCoverFile = document.getElementById('modalCoverFile');
    const modalAddSongBtn = document.getElementById('modalAddSongBtn');
    const playlistModalList = document.getElementById('playlistModalList');

    // ---------- 辅助函数 ----------
    function formatTime(sec) { if(isNaN(sec)) return "0:00"; const m=Math.floor(sec/60); const s=Math.floor(sec%60); return `${m}:${s<10?'0'+s:s}`; }

    function parseMilliseconds(msStr) {
        let msInt = parseInt(msStr, 10);
        if (isNaN(msInt)) return 0;
        if (msStr.length === 1) return msInt * 100;
        else if (msStr.length === 2) return msInt * 10;
        else if (msStr.length === 3) return msInt;
        else {
            const whole = parseInt(msStr.substring(0,3),10);
            const frac = parseInt(msStr.substring(3),10) / Math.pow(10, msStr.length-3);
            return whole + frac;
        }
    }

    function parseLyricsFull(content) {
        if (content.charCodeAt(0) === 0xFEFF) content = content.slice(1);
        const lines = content.split(/\r?\n/).filter(l=>l.trim());
        let songName = "未知歌曲", artistAlbum = "未知艺术家";
        if(lines.length>=1) songName = lines[0].trim();
        if(lines.length>=2) artistAlbum = lines[1].trim();
        const timeline = [];
        const regex = /(?:\[)?(\d{1,2}):(\d{1,2})\.(\d{1,6})(?:\])?\s*(.+)/;
        for(let i=2; i<lines.length; i++) {
            const m = lines[i].match(regex);
            if(m){
                const minutes = parseInt(m[1],10);
                const seconds = parseInt(m[2],10);
                const millis = parseMilliseconds(m[3]);
                const text = m[4].trim();
                if(text){
                    const timeSec = minutes*60 + seconds + millis/1000;
                    timeline.push({ time: parseFloat(timeSec.toFixed(3)), text });
                }
            }
        }
        return { songName, artistAlbum, timeline };
    }

    function updateBackgroundFromCover(src) {
        if(!src) return;
        dynamicBg.style.backgroundImage = `url('${src}')`;
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 50; canvas.height = 50;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img,0,0,50,50);
            const data = ctx.getImageData(0,0,50,50).data;
            let r=0,g=0,b=0,count=0;
            for(let i=0;i<data.length;i+=4){ r+=data[i]; g+=data[i+1]; b+=data[i+2]; count++; }
            r=Math.floor(r/count); g=Math.floor(g/count); b=Math.floor(b/count);
            bgOverlay.style.background = `linear-gradient(135deg, rgba(0,0,0,0.7), rgba(${r},${g},${b},0.68))`;
        };
        img.src = src;
    }

    // 歌词渲染与高亮
    let currentLyricsTimeline = [];
    let fsDomItems = [], mobileDomItems = [];
    let lastFsIdx = -1, lastMobileIdx = -1;

    class LyricsWithInterlude {
        constructor(timeline) {
            this.items = [];
            for(let i=0;i<timeline.length;i++){
                this.items.push({ type:'lyric', text:timeline[i].text, time:timeline[i].time });
                if(i<timeline.length-1 && timeline[i+1].time - timeline[i].time >=10)
                    this.items.push({ type:'interlude', start:timeline[i].time, end:timeline[i+1].time });
            }
        }
    }
    let structured = new LyricsWithInterlude([]);

    function renderBothPanels() {
        // 全屏渲染
        fsLyricsList.innerHTML = '';
        fsDomItems = [];
        structured.items.forEach(item=>{
            if(item.type === 'lyric'){
                const div = document.createElement('div');
                div.className = 'fs-lyric-item';
                div.textContent = item.text;
                div.setAttribute('data-time',item.time);
                div.onclick = ()=>{ if(audio && !isNaN(item.time)) audio.currentTime = item.time; };
                fsLyricsList.appendChild(div);
                fsDomItems.push({ el:div, type:'lyric', time:item.time });
            } else {
                const inter = document.createElement('div');
                inter.className = 'fs-interlude-dots hidden';
                inter.innerHTML = `<div class="fs-dot"></div><div class="fs-dot"></div><div class="fs-dot"></div><span style="margin-left:6px;font-size:0.7rem;">·  ·</span>`;
                inter.setAttribute('data-start',item.start);
                inter.setAttribute('data-end',item.end);
                fsLyricsList.appendChild(inter);
                fsDomItems.push({ el:inter, type:'interlude', start:item.start, end:item.end });
            }
        });
        // 移动端渲染
        mobileLyricsList.innerHTML = '';
        mobileDomItems = [];
        structured.items.forEach(item=>{
            if(item.type === 'lyric'){
                const div = document.createElement('div');
                div.className = 'lyric-item upcoming';
                div.textContent = item.text;
                div.setAttribute('data-time',item.time);
                div.onclick = ()=>{ if(audio && !isNaN(item.time)) audio.currentTime = item.time; };
                mobileLyricsList.appendChild(div);
                mobileDomItems.push({ el:div, type:'lyric', time:item.time });
            } else {
                const inter = document.createElement('div');
                inter.className = 'interlude-dots hidden';
                inter.innerHTML = `<div class="dot"></div><div class="dot"></div><div class="dot"></div><span style="margin-left:6px;font-size:0.7rem;">·  ·</span>`;
                inter.setAttribute('data-start',item.start);
                inter.setAttribute('data-end',item.end);
                mobileLyricsList.appendChild(inter);
                mobileDomItems.push({ el:inter, type:'interlude', start:item.start, end:item.end });
            }
        });
    }

    function scrollFullscreen(activeEl, container) {
        if(!activeEl) return;
        activeEl.scrollIntoView({ block:'center', behavior:'smooth' });
    }
    function scrollMobile(activeEl, container) {
        if(!activeEl) return;
        const cRect = container.getBoundingClientRect();
        const eRect = activeEl.getBoundingClientRect();
        const target = eRect.top - (cRect.top + cRect.height/2 - 100);
        container.scrollBy({ top:target, behavior:'smooth' });
    }

    function updateUIByPlaybackTime(currentSec) {
        // 全屏
        fsDomItems.forEach(it=>{
            if(it.type === 'interlude'){
                const inRange = (currentSec >= it.start && currentSec <= it.end);
                it.el.classList.toggle('hidden', !inRange);
            }
        });
        let activeIdx = -1;
        for(let i=0;i<fsDomItems.length;i++) if(fsDomItems[i].type==='lyric' && fsDomItems[i].time <= currentSec) activeIdx=i;
        for(let i=0;i<fsDomItems.length;i++){
            if(fsDomItems[i].type !== 'lyric') continue;
            const t = fsDomItems[i].time;
            if(currentSec >= t){
                if(i === activeIdx) { fsDomItems[i].el.classList.add('active'); fsDomItems[i].el.classList.remove('sung'); }
                else { fsDomItems[i].el.classList.add('sung'); fsDomItems[i].el.classList.remove('active'); }
            } else { fsDomItems[i].el.classList.remove('active','sung'); }
        }
        if(activeIdx !== -1 && activeIdx !== lastFsIdx){
            const actEl = fsDomItems[activeIdx]?.el;
            if(actEl) scrollFullscreen(actEl, fsLyricsScroll);
            lastFsIdx = activeIdx;
        }
        // 移动端
        mobileDomItems.forEach(it=>{
            if(it.type === 'interlude'){
                const inRange = (currentSec >= it.start && currentSec <= it.end);
                it.el.classList.toggle('hidden', !inRange);
            }
        });
        let mobileActive = -1;
        for(let i=0;i<mobileDomItems.length;i++) if(mobileDomItems[i].type==='lyric' && mobileDomItems[i].time <= currentSec) mobileActive=i;
        for(let i=0;i<mobileDomItems.length;i++){
            if(mobileDomItems[i].type !== 'lyric') continue;
            const t = mobileDomItems[i].time;
            if(currentSec >= t){
                if(i === mobileActive) { mobileDomItems[i].el.classList.add('active'); mobileDomItems[i].el.classList.remove('sung','upcoming'); }
                else { mobileDomItems[i].el.classList.add('sung'); mobileDomItems[i].el.classList.remove('active','upcoming'); }
            } else { mobileDomItems[i].el.classList.add('upcoming'); mobileDomItems[i].el.classList.remove('active','sung'); }
        }
        if(mobileActive !== -1 && mobileActive !== lastMobileIdx){
            const actEl = mobileDomItems[mobileActive]?.el;
            if(actEl) scrollMobile(actEl, mobileLyricsArea);
            lastMobileIdx = mobileActive;
        }
    }

    function updateProgressAndTime() {
        if(!audio.duration) return;
        const percent = (audio.currentTime/audio.duration)*100;
        fsProgressFill.style.width = percent+'%';
        mobileProgressFill.style.width = percent+'%';
        const cur = formatTime(audio.currentTime);
        const dur = formatTime(audio.duration);
        fsCurrentTime.textContent = cur;
        mobileCurrentTime.textContent = cur;
        fsDuration.textContent = dur;
        mobileDuration.textContent = dur;
        updateUIByPlaybackTime(audio.currentTime);
    }

    function startAnimation() { if(animFrame) cancelAnimationFrame(animFrame); (function tick(){ if(audio && !audio.paused && audio.src) updateProgressAndTime(); animFrame = requestAnimationFrame(tick); })(); }

    function togglePlayPause() {
        if(isPlaying) { audio.pause(); isPlaying=false; fsPlayPause.innerHTML='▶'; mobilePlayPause.innerHTML='▶'; if(animFrame) cancelAnimationFrame(animFrame); animFrame=null; }
        else {
            // 如果没有歌曲，弹出添加菜单
            if(!audio.src && playlist.length === 0) {
                showPlaylistModal();
                return;
            }
            // 如果有歌曲但 audio.src 为空（播放结束后被清空），重新播放最后一首
            if(!audio.src && playlist.length > 0) {
                playSongById(playlist[playlist.length-1].id);
                return;
            }
            audio.play().then(()=>{ isPlaying=true; fsPlayPause.innerHTML='■'; mobilePlayPause.innerHTML='■'; startAnimation(); }).catch(()=>{});
        }
    }

    function seek(delta) { if(audio.src) audio.currentTime = Math.min(Math.max(0, audio.currentTime+delta), audio.duration); }

    function prevSong() { if(!playlist.length) return; let idx = playlist.findIndex(s=>s.id===currentSongId); if(idx===-1) idx=0; let newIdx = (idx-1+playlist.length)%playlist.length; playSongById(playlist[newIdx].id); }
    function nextSong() { if(!playlist.length) return; let idx = playlist.findIndex(s=>s.id===currentSongId); if(idx===-1) idx=0; let newIdx = (idx+1)%playlist.length; playSongById(playlist[newIdx].id); }

    function initSwipe(el){
        let startX=0, startTime=0;
        const onTouchStart=(e)=>{ startX = e.touches[0].clientX; startTime=Date.now(); };
        const onTouchEnd=(e)=>{
            if(!audio.src) return;
            const deltaX = e.changedTouches[0].clientX - startX;
            if(Math.abs(deltaX)>30 && Date.now()-startTime<300){
                if(deltaX>0) seek(10);
                else seek(-10);
            }
        };
        el.addEventListener('touchstart',onTouchStart);
        el.addEventListener('touchend',onTouchEnd);
        let mouseDown=false, mouseStartX=0;
        const onMouseDown=(e)=>{ mouseDown=true; mouseStartX=e.clientX; };
        const onMouseUp=(e)=>{
            if(!mouseDown) return;
            mouseDown=false;
            if(!audio.src) return;
            const deltaX = e.clientX - mouseStartX;
            if(Math.abs(deltaX)>30){
                if(deltaX>0) seek(10);
                else seek(-10);
            }
        };
        el.addEventListener('mousedown',onMouseDown);
        window.addEventListener('mouseup',onMouseUp);
    }

    function toggleRepeat() { isRepeat = !isRepeat; fsRepeatBtn.classList.toggle('repeat-active', isRepeat); mobileRepeatBtn.classList.toggle('repeat-active', isRepeat); }

    function playSongById(id){
        const song = playlist.find(s=>s.id===id);
        if(!song) return;
        if(audio.src) URL.revokeObjectURL(audio.src);
        audio.src = song.audioUrl;
        currentSongId = song.id;
        fsSongTitle.textContent = song.name;
        fsArtist.textContent = song.artist;
        mobileSongTitle.textContent = song.name;
        mobileArtist.textContent = song.artist;
        fsCoverImg.src = song.coverUrl;
        mobileCoverImg.src = song.coverUrl;
        updateBackgroundFromCover(song.coverUrl);
        currentLyricsTimeline = song.lyricsTimeline || [];
        structured = new LyricsWithInterlude(currentLyricsTimeline);
        renderBothPanels();
        audio.load();
        audio.play().then(()=>{ isPlaying=true; fsPlayPause.innerHTML='■'; mobilePlayPause.innerHTML='■'; startAnimation(); }).catch(()=>{});
        updatePlaylistModalUI();
    }

    function deleteSongById(id){
        let idx = playlist.findIndex(s=>s.id===id);
        if(idx===-1) return;
        const song = playlist[idx];
        if(song.audioUrl?.startsWith('blob:')) URL.revokeObjectURL(song.audioUrl);
        if(song.coverUrl?.startsWith('blob:')) URL.revokeObjectURL(song.coverUrl);
        playlist.splice(idx,1);
        if(currentSongId===id){
            if(playlist.length) playSongById(playlist[0].id);
            else {
                audio.pause(); isPlaying=false; fsPlayPause.innerHTML='▶'; mobilePlayPause.innerHTML='▶';
                if(audio.src) URL.revokeObjectURL(audio.src);
                audio.src = "";
                fsSongTitle.textContent="暂无歌曲"; fsArtist.textContent="点击菜单添加";
                mobileSongTitle.textContent="暂无歌曲"; mobileArtist.textContent="点击菜单添加";
                const def = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232c2e3a'/%3E%3Ctext x='50' y='55' font-size='12' fill='%23cbbfaa' text-anchor='middle'%3E🎵%3C/text%3E%3C/svg%3E";
                fsCoverImg.src = def; mobileCoverImg.src = def; updateBackgroundFromCover(def);
                currentLyricsTimeline = []; structured = new LyricsWithInterlude([]); renderBothPanels();
                currentSongId = null;
            }
        }
        updatePlaylistModalUI();
    }

    function addNewSong(audioFile, lyricsFile, coverFile){
        if(!audioFile){ alert("请选择音频文件"); return; }
        const audioUrl = URL.createObjectURL(audioFile);
        let coverUrl = coverFile ? URL.createObjectURL(coverFile) : 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Crect width=\'100\' height=\'100\' fill=\'%232c2e3a\'/%3E%3Ctext x=\'50\' y=\'55\' font-size=\'12\' fill=\'%23cbbfaa\' text-anchor=\'middle\'%3E🎵%3C/text%3E%3C/svg%3E';
        let songName = audioFile.name.replace(/\.(mp3|m4a|flac)$/i,'') || "未知歌曲";
        let artist = "未知艺术家";
        let lyricsTimeline = [];
        const finalize = (parsedName, parsedArtist, timeline)=>{
            if(parsedName && parsedName!="未知歌曲") songName = parsedName;
            if(parsedArtist && parsedArtist!="未知艺术家") artist = parsedArtist;
            if(timeline?.length) lyricsTimeline = timeline;
            const newSong = { id:Date.now(), name:songName, artist:artist, audioUrl, coverUrl, lyricsTimeline };
            playlist.push(newSong);
            if(!currentSongId) playSongById(newSong.id);
            updatePlaylistModalUI();
        };
        if(lyricsFile){
            const reader = new FileReader();
            reader.onload = (e)=>{ const {songName:lrcSong, artistAlbum, timeline} = parseLyricsFull(e.target.result); finalize(lrcSong, artistAlbum, timeline); };
            reader.readAsText(lyricsFile,"UTF-8");
        } else finalize(null,null,[]);
    }

    function updatePlaylistModalUI(){
        playlistModalList.innerHTML = '';
        if(playlist.length===0){
            playlistModalList.innerHTML = '<div style="text-align:center;opacity:0.6;padding:20px;">暂无歌曲，请点击下方添加</div>';
            return;
        }
        playlist.forEach(song=>{
            const div = document.createElement('div');
            div.className = 'playlist-song-item';
            div.innerHTML = `<div class="playlist-song-info"><div class="playlist-song-name">${escapeHtml(song.name)}</div><div class="playlist-song-artist">${escapeHtml(song.artist)}</div></div><button class="playlist-delete-btn" data-id="${song.id}">🗑️</button>`;
            div.querySelector('.playlist-delete-btn').addEventListener('click',(e)=>{ e.stopPropagation(); deleteSongById(song.id); });
            div.addEventListener('click',()=>{ playSongById(song.id); closePlaylistModal(); });
            playlistModalList.appendChild(div);
        });
    }

    function escapeHtml(str){ return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    function showPlaylistModal() { playlistModal.classList.add('show'); updatePlaylistModalUI(); }
    function closePlaylistModal() { playlistModal.classList.remove('show'); }
    function handleModalAddSong(){
        const audioFile = modalAudioFile.files[0];
        const lyricsFile = modalLyricsFile.files[0];
        const coverFile = modalCoverFile.files[0];
        if(!audioFile){ alert("请选择音频文件"); return; }
        addNewSong(audioFile, lyricsFile, coverFile);
        modalAudioFile.value = ''; modalLyricsFile.value = ''; modalCoverFile.value = '';
        closePlaylistModal();
    }

    // ---------- 网页全屏切换（单击封面） ----------
    let isWebFullscreen = false;
    function toggleWebFullscreen() {
        if (!isWebFullscreen) {
            appContainer.classList.add('web-fullscreen');
            isWebFullscreen = true;
        } else {
            appContainer.classList.remove('web-fullscreen');
            isWebFullscreen = false;
        }
        // 刷新歌词滚动区域
        setTimeout(() => {
            if (fsLyricsScroll) {
                fsLyricsScroll.style.maxHeight = '';
                fsLyricsScroll.style.maxHeight = fsLyricsScroll.clientHeight + 'px';
            }
            if (audio && audio.currentTime) updateUIByPlaybackTime(audio.currentTime);
        }, 100);
    }

    // 上传封面单独处理（通过播放列表管理器的“更换专辑封面”选项）
    function uploadCoverImage() {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'image/jpeg,image/png,image/webp';
        inp.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const src = ev.target.result;
                    fsCoverImg.src = src;
                    mobileCoverImg.src = src;
                    updateBackgroundFromCover(src);
                };
                reader.readAsDataURL(file);
            }
        };
        inp.click();
    }

    // 为封面绑定单击网页全屏
    const fullscreenCover = document.getElementById('fullscreenCoverTrigger');
    const mobileCover = document.getElementById('mobileCoverTrigger');
    fullscreenCover.addEventListener('click', toggleWebFullscreen);
    mobileCover.addEventListener('click', toggleWebFullscreen);

    // 其他事件绑定
    document.getElementById('fullscreenSongInfo').addEventListener('click', showPlaylistModal);
    document.getElementById('mobileSongInfo').addEventListener('click', showPlaylistModal);
    initSwipe(document.getElementById('fullscreenSongInfo'));
    initSwipe(document.getElementById('mobileSongInfo'));

    fsPlayPause.addEventListener('click', togglePlayPause);
    mobilePlayPause.addEventListener('click', togglePlayPause);
    fsPrevBtn.addEventListener('click', prevSong);
    mobilePrevBtn.addEventListener('click', prevSong);
    fsNextBtn.addEventListener('click', nextSong);
    mobileNextBtn.addEventListener('click', nextSong);
    fsRepeatBtn.addEventListener('click', toggleRepeat);
    mobileRepeatBtn.addEventListener('click', toggleRepeat);
    fsMenuBtn.addEventListener('click', showPlaylistModal);
    mobileMenuBtn.addEventListener('click', showPlaylistModal);
    closePlaylistModalBtn.addEventListener('click', closePlaylistModal);
    modalAddSongBtn.addEventListener('click', handleModalAddSong);
    window.addEventListener('click', (e)=>{ if(e.target===playlistModal) closePlaylistModal(); });
    fsProgressBg.addEventListener('click', (e)=>{ if(!audio.duration) return; const rect = fsProgressBg.getBoundingClientRect(); let percent = (e.clientX-rect.left)/rect.width; percent = Math.min(1,Math.max(0,percent)); audio.currentTime = percent*audio.duration; updateProgressAndTime(); });
    mobileProgressBg.addEventListener('click', (e)=>{ if(!audio.duration) return; const rect = mobileProgressBg.getBoundingClientRect(); let percent = (e.clientX-rect.left)/rect.width; percent = Math.min(1,Math.max(0,percent)); audio.currentTime = percent*audio.duration; updateProgressAndTime(); });
    
    // 修复播放结束逻辑：不在 isRepeat 时自动暂停，点击播放按钮重新播放最后一首
    audio.addEventListener('ended', () => {
        if (isRepeat && currentSongId) {
            // 单曲循环：重新播放当前歌曲
            audio.currentTime = 0;
            audio.play().catch(() => {});
        } else if (playlist.length) {
            // 列表播放结束后：自动暂停并清空当前 src，方便点击播放按钮重新播放最后一首
            const currentIdx = playlist.findIndex(s => s.id === currentSongId);
            if (currentIdx === playlist.length - 1) {
                // 最后一首播放结束，停止播放，不清空歌曲信息但清空 audio.src
                audio.pause();
                isPlaying = false;
                fsPlayPause.innerHTML = '▶';
                mobilePlayPause.innerHTML = '▶';
                if (animFrame) cancelAnimationFrame(animFrame);
                animFrame = null;
                // 保留 audio.src 不撤销，或者撤销？为了方便下次播放，保留 src 但设置 currentTime 为0？我们选择保留 src 且 currentTime=0 并暂停
                audio.currentTime = 0;
            } else {
                // 还有下一首，自动播放下一首
                let idx = playlist.findIndex(s => s.id === currentSongId);
                let nextIdx = (idx + 1) % playlist.length;
                playSongById(playlist[nextIdx].id);
            }
        } else {
            // 无歌曲列表
            audio.pause();
            isPlaying = false;
            fsPlayPause.innerHTML = '▶';
            mobilePlayPause.innerHTML = '▶';
            if (animFrame) cancelAnimationFrame(animFrame);
            animFrame = null;
        }
    });
    
    audio.addEventListener('timeupdate', () => updateUIByPlaybackTime(audio.currentTime));

    // 初始化
    renderBothPanels();
    updateBackgroundFromCover(fsCoverImg.src);
    startAnimation();
    setInterval(()=>{ if(audio && audio.src && !audio.paused) updateUIByPlaybackTime(audio.currentTime); }, 150);
    updateUIByPlaybackTime(0);
</script>
</body>
